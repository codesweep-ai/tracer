er one trace page's own chunks, so adding trajectories to an export does not add to it. There is nothing here worth the code.","details":"Each search walks every chunk again, with nothing kept between queries. On a large export that is the dominant cost of a search, and it grows with every trajectory added.","notes":[{"date":"2026-09-22","text":"The first timing run read the status line one query late, because the previous result was still on screen when the poll began. Clearing the box between queries and waiting for a fresh status gave consistent numbers."}],"links":[]},{"id":"TRC-032","title":"A --split export ships every trajectory's data twice","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, carried from the previous handoff; SPEC open question 3","opened":"2026-09-21","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["a020ea9"],"integrated":[],"verified":"Four corpora were exported through `--split` with the build before the change and the build after it, and the trace pages and assets compared byte for byte. The change reached only `index.html`. The codex corpus fell from 27.8 MB to 14.6 MB, its index from 13.7 MB to 0.5 MB, and it no longer trips the size warning. The attended Claude corpus fell from 26.0 MB to 14.6 MB, the unattended one from 8.6 MB to 4.8 MB, and the OpenCode corpus from 15.7 MB to 8.4 MB.\n\nHeadless loads of the codex site before and after render the same index markup, byte for byte, and the first lane's trace page renders the same cards. The index opened with `?trace=\u003cid>#ev-3` lands on that trace's page at that event, with no page error. `make ci` passes: parity PASS, and every fixture check passes, 27 ok and 9 met. No golden and no fixture expectation moved, since both measure the single-file export."},"resolution":"The split `index.html` now carries every trajectory's summary and no chunk, and each trace page carries its own events (R84). The index renders only the strips, so nothing on screen changes, and the export is about half the size. A split index opened with `?trace=\u003cid>` used to render that trajectory in place. It now goes to the trace's own page, keeping any event anchor, since the index no longer holds the events.","details":"In one measured export the split output was 24.6 MB against 12.4 MB for the same data. The split `index.html` embeds every trace's events, which the index never renders, and each trace page carries its own copy.","notes":[{"date":"2026-09-22","text":"Only the trajectory page reads chunk blocks. The index page reads summaries and strips, and in split mode every lane link leads to a trace page, so the index never needed the events it carried. The one reader that did was the undocumented `?trace=\u003cid>` query on a split index, which the viewer honoured in every mode."}],"links":[]},{"id":"TRC-033","title":"A deep link to an event sometimes scrolls the event list to the wrong position","type":"defect","severity":"med","status":"closed","foundBy":"another agent session, checking deep links for tools that will link into the tracer; the session agent saw it too while verifying TRC-027","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 strip changes","evidence":{"commits":["40ab252"],"integrated":[],"verified":"Deep links were swept on cold loads. On the 1027-event attended trace, misses fell from 63 of 147 to none at 1280 by 900, and none of 94 at 1000 by 1300. On the fixtures, the old build missed 10 of 39 on one and 10 of 24 on another, and the fix missed none. After landing, a wheel, Page Down or direct scroll still moves the list, and the hash follows. TF-36 fails against the old build. `make ci` passes, and the maintainer checked links in the viewer."},"resolution":"A navigation now lands only when every card above the target in the rendered window is measured and the list sits at the target's offset, or at its end. Until then each measurement re-aims the scroll. Once landed, the card stays anchored through later re-measurement while the list has not moved, and any reader input ends both. R81 states the rule, and TF-36 checks eight cold deep links per fixture.","details":"Opening a trajectory page with `#ev-N` in the URL selects event N on the strip correctly. The event list below it does not always scroll so that card N sits at the top. Sometimes the next card is at the top, with card N just above the visible area. Sometimes card N is at the top but cut off partway down.\n\nCard N's header should be the first thing visible in the list, every time, for any N. Other tools will link into the tracer by event, so a link has to land on the event it names.\n\nTo reproduce, open a trajectory with a few hundred events at `#ev-N` in a fresh tab and try several values of N. On one 372-event trace, N=123 opened with #124 at the top on every attempt, while N=5, 120 and 300 landed. On a 702-event trace, N=252 opened partway down its card at two window sizes. Whether a given N fails is repeatable, but it depends on N.","notes":[{"date":"2026-09-21","text":"A sweep of one 1027-event attended trace missed on 63 of 147 links, by 70 to 1127 px, while a 232-event trace missed none. On every miss the list stays at N times the estimated row height and never scrolls again. The first check finds card N at the top by the estimates alone and discharges the navigation. Real heights then land and move the card, and nothing corrects the scroll. The links that work are those where card N was off screen at that first check."}],"links":[]},{"id":"TRC-034","title":"A turn end followed only by bookkeeping reports no idle, while elapsed runs to the bookkeeping","type":"defect","severity":"med","status":"closed","foundBy":"session agent, characterising the unclassified time TRC-029 measured across the attended Claude Code corpus","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["5157f43","adb8def"],"integrated":[],"verified":"The attended corpus was normalized with the build before the change and the build after it. Every trajectory's idle and work intervals were then rebuilt from the events, as TRC-029 did. The remainder that belongs to neither falls from 5.75 to 0.57 hours of 343.5, from 1.67 to 0.17 per cent, and no gap after a session's last turn end remains. The session that held the five-hour wait now reports 50.2 of its 52.7 open hours as idle, against 45.1 before. The codex corpus is unchanged at 2.45 per cent, since its remainder has another cause.\n\nUnit tests cover the wait running to the last record, and the field staying absent on a turn end that is the last record of all. A third covers two turn ends with no work between, which never overlap. The regenerated goldens differ only by the new idle on three final turn ends, its total, and the strip entry size that carries it. `make ci` passes: parity PASS, and every fixture check passes, 27 ok and 9 met."},"resolution":"A turn end that no work follows is now idle to the last record after it. That record proves the session was still open and waiting, and elapsed already counted the interval. A turn end that is the last record of all still carries no field, because waiting for nothing and waiting no time are different claims. The scan stops at the next turn end, so two never overlap. R68's text says so.","details":"Idle is stamped on a turn end only when a later event resumes work, and elapsed time runs to the latest timestamp the trajectory records. When a session's last turn ends and the only records after it are bookkeeping, such as a local command run hours later, the two rules disagree. Elapsed counts the hours up to that record and idle counts none of them, so they land in the remainder that belongs to neither.\n\nIn the attended corpus this is 5.18 of the 5.75 hours that TRC-029 could not place, in 3 of the 6 top-level sessions. One session ended a turn at night and the user ran a local command five hours later, with nothing after it. That is 5.10 hours of remainder on its own.\n\nThe agent was waiting through that whole interval: the later record proves the session was still open. Idle should run to the last timestamp the trajectory records when no work resumes but a later record exists. A turn end that is the last record of all still carries no field, since then nothing says how long the wait was.","notes":[],"links":["TRC-029"]},{"id":"TRC-035","title":"A sub-agent that stops with no tool call pending reports no turn end, so its wait is neither idle nor work","type":"defect","severity":"low","status":"wont-fix","foundBy":"session agent, characterising the unclassified time TRC-029 measured across the attended Claude Code corpus","opened":"2026-09-22","resolved":"2026-09-22","stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":"The maintainer read the three defects that TRC-029's investigation filed and chose to fix only the turn end followed by bookkeeping, which holds 89 per cent of the remainder. This one is 23 minutes across a corpus of 343 hours, in sub-agent trajectories. The defect stays recorded, and can be reopened if the figure ever matters.","details":"The Claude Code adapter derives every turn end from the CLI's turn-duration record. Sub-agent transcripts carry none: across the 25 sub-agent trajectories in the attended corpus there is no turn-duration record and no turn end, against 426 in the 6 top-level sessions. A sub-agent may reply with no tool call pending, for instance to say it is waiting for a background monitor. It then sits until a notification arrives as a user message minutes later. With no turn end there is no idle, and the reply's work ended at the reply, so the wait belongs to nothing.\n\nThis is 23 minutes of the remainder TRC-029 measured, in 5 gaps of 4 to 6 minutes. The reply's own record says the turn ended: its stop reason reads `end_turn`, which is exactly the definition R68 gives. Where no turn-duration record follows such a reply before work resumes, the adapter can derive the turn end from the stop reason.","notes":[],"links":["TRC-029"]},{"id":"TRC-036","title":"The interval before a turn end that ended in an error belongs to nothing","type":"defect","severity":"low","status":"wont-fix","foundBy":"session agent, characterising the unclassified time TRC-029 measured across the attended Claude Code corpus","opened":"2026-09-22","resolved":"2026-09-22","stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":"The maintainer read the three defects that TRC-029's investigation filed and chose to fix only the turn end followed by bookkeeping, which holds 89 per cent of the remainder. This one is milliseconds per turn on Claude Code, and on codex only turns that a rate-limit error ended. The defect stays recorded, and can be reopened if the figure ever matters.","details":"A turn end draws no work: work is stamped on thinking, replies and tool calls, and a turn end's idle starts at its own timestamp. When a turn ends without a final reply, the interval from the last piece of work to the turn end record is neither. In the codex corpus this is the whole of its remainder: 0.34 of 13.8 hours, or 2.45 per cent, in 23 gaps of up to 1.6 minutes. Each is a turn that a rate-limit error ended one to two minutes after the last tool result. The agent was waiting on the provider through that interval, which R70 calls work.\n\nIn the Claude Code corpus the same shape is 419 gaps of a few milliseconds each, 36 seconds in all. Each sits between a final reply and the turn-duration record that follows it.","notes":[],"links":["TRC-029"]},{"id":"TRC-037","title":"An export with no readable session shows a schema mismatch instead of an empty overview","type":"defect","severity":"low","status":"closed","foundBy":"session agent, rendering every captured fixture for a gallery the maintainer asked for","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["77300d8"],"integrated":[],"verified":"Exported the two fixtures that hold no readable session with the build before the change and the build after it, and loaded each page headlessly. Before, both pages showed the version-mismatch alert and no overview. After, both show the overview with no sessions, no events and no tokens, and raise no page error. A unit test loads an empty tree and asserts the index it stands in declares the version the build emits, with no trajectories. `make ci` passes: parity PASS, and every fixture check passes, 27 ok and 9 met."},"resolution":"The index the assembler stands in for a tree with no readable session now declares the version this build emits. It does so through the same constant every other index uses, so the viewer renders an empty overview.","details":"When every input file is skipped, the normalizer writes no index, and the export assembler stands in an empty index of its own. That stand-in declares schema version 1, while the viewer implements version 3 and refuses any other (R7). The page then refuses the document, naming the two versions and asking for a re-export with a matching cs-tracer, which sends whoever reads it after the wrong problem. The page that tells the truth shows an overview with no sessions.\n\nTwo captured fixtures, `claude/v2.1/all-skipped` and `claude/v2.1/empty-session`, produce this page when exported. R9 says every declaration of the version must agree, and this one is the fifth, written as a literal beside the constant the assembler uses everywhere else.","notes":[],"links":[]},{"id":"TRC-038","title":"A linked folder under the input is dropped without a skip line","type":"defect","severity":"med","status":"closed","foundBy":"another agent's report, relayed by the maintainer: \"A linked folder is skipped, and nothing says so. The sub-agents folder was dropped, and I got 1 trace instead of 11.\"","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["be9e278"],"integrated":[],"verified":"The report's layout was rebuilt as a directory of four links. Two point at the subagent-run fixture's session file and its sub-agents folder. One points back at the directory itself, and one at a file that does not exist. The build before the change normalized 1 trajectory from it and printed no skip. The build after normalizes 3, the same as reading the fixture directly. It prints one skip line naming the dangling entry, and returns at once despite the loop. Each sub-agent records the linked path as the directory it was read from.\n\nA unit test pins all of that, including the same folder linked twice reading its sessions once. `make ci` passes: parity PASS, and every fixture check passes, 27 ok and 9 met. No golden moved, since discovery order is unchanged for a tree without links."},"resolution":"Discovery now follows a link to a folder, reads each real folder once however many paths lead to it, and reports a link that leads nowhere as a skip (R86). The manual says so. A set assembled from links therefore reads the same as one assembled from copies. Remembering every real folder already visited closes off both the loop and the double read that made following risky.","details":"Discovery walks the input with Go's directory walker, which does not enter a symbolic link to a folder. A link to a session file is read. A link to a folder, such as a session's sub-agents directory, is passed over, and the tool says nothing. Every other file it passes over gets a skip line on stderr, so a sub-agent tree lost this way looks exactly like a session that never had sub-agents.\n\nReproduced on the subagent-run fixture. Read directly it normalizes 3 trajectories. Read through a directory holding a link to its session file and a link to its sub-agents folder, it normalizes 1, and the output names no skip. Neither the manual nor the spec mentions links.\n\nNot entering links may be right, since it keeps a walk from looping. What is wrong is the silence. Either follow a linked folder, guarding against loops, or print a skip line naming it, and say which in the manual. This only affects an input assembled from links; pointing the tool at a projects directory directly is unaffected.","notes":[],"links":[]},{"id":"TRC-039","title":"A failed step on the strip is drawn as a cross too small to see","type":"improvement","severity":"med","status":"closed","foundBy":"user report (maintainer): \"It's a very ugly x and isn't easy to spot\", with a design another agent built on a consuming page","opened":"2026-09-22","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["8050b92","9b7c7e6","21a193d"],"integrated":[],"verified":"The attended corpus was exported with the new build and the page for its longest session opened headlessly at a failed tool call, in dark and in light. In the ordinary view the failed step is a bar in the error colour at its own height, with nothing inside or above it, ringed by the selection. With errors only on it stands at the top of its row with a dot above it, and every other bar is dimmed. The ring wraps the whole tall bar and the dot. The dot sits inside the canvas in both themes, since the row keeps six pixels above the tallest bar. The errors control beside the kind chips and the index legend both show a plain square in the error colour, and the failed card's title mark is the same square.\n\nUnit tests pin the mapping. A failed step becomes its own kind painted in the error colour with no cross. It rises to the ceiling with a dot only when errors only is on, and the ceiling leaves headroom. A spawn's marker takes another colour, and a kind chip hides its failed steps too. The card mark test asserts the error fill with nothing drawn inside. `make ci` passes: parity PASS on three runs, and every fixture check passes, 27 ok and 9 met. One budget moved: the ui build the mark needs is 16 KB larger, and the maintainer raised the large-session page budget to 1,500,000 bytes."},"resolution":"A failed step is drawn in the error colour, never as a glyph inside the cell (R47). With errors only on it rises to the top of its row with a dot of that colour above it, and everything else dims. When selected, the taller bar is ringed whole. The legend key and the card's title mark are the same plain square. The treatment matches the other consumer of the strip component, which the maintainer reviewed against this one. The dot's colour comes from the marker token in the ui build this record moved tracer's pin to.","details":"A failed step is marked by a cross painted inside its cell over the kind colour (R47). At the strip's cell width of 13 pixels the cross is two thin strokes inside a bar a few pixels wide. A reader scanning for failures does not find them. A mock of the same synthetic run showed three failures among forty events; with the cross they were all but invisible at real size.\n\nThe agreed design, from another agent's page and a mock the maintainer reviewed:\n\n- In the ordinary view a failed step takes the error colour as its fill, at its real height, and nothing is drawn inside or above it. Colour is what the eye finds.\n- With errors only on, a failed step is drawn at full lane height with a dot of the error colour above it, and everything else is dimmed, so failures stand out at any zoom. Height means time in the ordinary view and means failure in this mode, which is explicit.\n- The dot must never be clipped, at the top of a lane, at either end of the strip, or when the strip scrolls.\n- When a failed step is selected in errors-only mode, the selection highlight must cover the full-height bar, not the bar's ordinary height.\n\nR47 is rewritten, since it forbids replacing the kind fill. The legend's cross entry becomes a plain error swatch. The card's own mark, which mirrors its cell so the two can be matched, takes the same treatment. The dot's colour comes from the marker token the ui component gained on 2026-09-22, which is not yet in a published build. So ui publishes first, then tracer's pin moves, then the strip changes. The pixel parity gate and the fixture checks that read the strip will move and need approval.","notes":[{"date":"2026-09-22","text":"In the mock the maintainer reviewed, the dot was in the accent colour. The other consumer of the component draws it in the error colour, and the maintainer chose to match it, so a reader moving between the two learns one mark. A spawn's marker takes the foreground colour instead, so the two dots never read alike."},{"date":"2026-09-22","text":"Seen on a real trace, the dot in the ordinary view looked odd. The maintainer kept it for errors only, where the raised bar is, and asked for the plain square in the errors control. That matches the other consumer, which also draws the dot only in that mode."}],"links":["TRC-020"]},{"id":"TRC-040","title":"make repin pins a sibling's tip whether or not its CI passed","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"If I wanted make repin to look for the last green built commit, could this just work with curl?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"last-green-pins","evidence":{"commits":["a350abb","950a957","76d4ef4"],"integrated":[],"verified":"`make repin` in a clean clone of main at 76d4ef4 pinned each codesweep-ai tool at the first commit in its project's `built` list. The pin on lint went to its last build, though lint's main had since moved on to commits that changed only the ledger."},"resolution":"`make repin` pins each codesweep-ai tool to the first commit in the `built` list of that project's status file. A tool whose project lists no build keeps its pin rather than moving to the tip.","details":"`make repin` moves every codesweep-ai tool pin to its sibling's main with `go get …@main`. The tip of main may be a commit whose CI failed, one still building, or one that changed only the ledger and was never built. The status file each project publishes now names the newest commit its CI built and passed, as `built`. `make repin` pins that commit, and falls back to the tip where the file names none.","notes":[{"date":"2026-09-23","text":"`make repin` now reads `built` as the list the status file holds, and keeps a pin whose project lists no build. Moving it to the tip would pin a commit that may not have built."}],"links":[]},{"id":"TRC-041","title":"A push that changes only the ledger runs the whole of ci","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"support ledger builds on pushes that only contain ledger changes, with just linting, ledger checking, and a pages build to publish the ledger page\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"ledger-builds","evidence":{"commits":["0ec4f6a"],"integrated":[],"verified":"Pushing 3d5827a, which changed only `ledger/`, started the ledger and pages workflows and no ci. Both passed, and the status file still lists 76d4ef4 first in `built`."},"resolution":"ci skips a push that changes only `ledger/`. The ledger workflow runs the ledger check and the document linters, and pages republishes the ledger's page. Nothing is built or published, so `built` stays.","details":"Closing an issue is a commit that changes only `ledger/`, and pushing it runs the whole of `ci`. Nothing `ci` builds or tests has changed but the records. Such a push needs only the ledger check, the document linters and a site build, which publishes the ledger's page.","notes":[],"links":[]},{"id":"TRC-042","title":"make repin leaves the viewer's ui pin where it is","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"is make repin also repinning the npm dependency on the ui npm package in the ledger, tracer and campaign projects?\"","opened":"2026-09-23","resolved":"2026-09-23","stint":"npm-repins","evidence":{"commits":["138122c","b9d163f"],"integrated":[],"verified":"In a clean clone of main with the change, `make repin` moved the viewer's ui pin to ui's last build and rebuilt both committed viewer builds, and `make ci` then passed. `make -n repin` moved no pin. ci runs 35957447340 and 35958977088 passed on the two commits."},"resolution":"`make repin` moves the viewer's `@codesweep-ai/ui` pin to the npm version of ui's last build, through `scripts/repin-npm.mjs`, and rebuilds the committed viewer on it. Where the status file lists no npm version yet, it takes the version the build's npm image carries. A pin whose project lists no build stays where it is.","details":"`make repin` moves the codesweep-ai tools in `go.mod` to the last commit each one's CI built, and stops there. The viewer's `@codesweep-ai/ui` pin in `apps/viewer/package.json` stays where it was set by hand. It moves only through oss-repin, which needs every sibling checked out beside this one. A clone of this repository alone has no way to take ui's last build.","notes":[],"links":[]},{"id":"TRC-043","title":"A passing make ci leaves no build a sibling can pin","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["4b65718"],"integrated":[],"verified":"`make ci` at c342fc4 ended `record-build: recorded tracer c342fc4 as a local build in ~/.local/share/cs-builds/codesweep-ai (go v0.0.0-20260926051938-c342fc49291f)`. dashboards' tests/test_record_build.py passes all 15 of its tests against this same scripts/record-build.sh, byte for byte. GitHub CI's `ci` passed on c342fc4."},"resolution":"A clean, passing `make ci` now records its commit in the owner's build store, `~/.local/share/cs-builds/\u003cowner>/`. It keeps the Go module in the module proxy's layout, the npm packages where the project has them, and an entry naming the versions. A run over uncommitted changes records nothing, and says so.","details":"`make ci` runs every gate CI runs, on this machine, and leaves nothing another project can pin. Pins move only to commits GitHub CI lists as built. So a change across several projects has to be pushed and built one project at a time before the next can pin it. A clean passing run could record its commit as a local build instead: the module zip Go resolves it from, and an entry naming its versions. They would go in a store the sibling projects read. Go and npm builds of a clean commit are byte-identical to CI's. A pin on such a build is therefore the pin CI writes once that commit is pushed.","notes":[],"links":[]},{"id":"TRC-044","title":"make repin cannot pin a sibling's local build","type":"improvement","severity":"low","status":"closed","foundBy":"user report (host): \"it doesn't seem possible anymore to have make repin do pin on local builds, which haven't been published to ghcr.io or npmjs.com or built in the Github CI builds\"","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["4b65718"],"integrated":[],"verified":"dashboards' tests/test_repin_go.py passes all 7 of its tests against this same scripts/repin-go.sh. They pin and name a newer local build, and take CI's under `LOCAL=0`, when CI's is newer, and on a tie. They hold a build awaiting images, and skip one whose commit left the branch. In ui, scripts/repin-npm.test.mjs passes all 17 of its tests against this same scripts/repin-npm.mjs. In a scratch workspace, campaign's copy left out sandbox's newest local build once the sandbox checkout beside it held that commit on no branch. It said so, and took the build CI had made. GitHub CI's `ci` passed on c342fc4."},"resolution":"`make repin` now moves each cs- pin to the newer, by commit time, of the sibling's last CI build and its newest local build. It names each pin taken from a local build, and resolves those through the store's module proxy ahead of the usual one. `make repin LOCAL=0` takes CI builds only, and no module is fetched with `GOPROXY=direct` any more. The viewer's @codesweep-ai/ui pin moves the same way, through scripts/repin-npm.mjs.","details":"`make repin` moves each codesweep-ai tool pin to the first commit in `built` of its project's status file, and to nothing else. A build that a clean `make ci` recorded in the build store is invisible to it. So a change made across several projects cannot pin its own parts before they are pushed. Every module is also fetched with `GOPROXY=direct`. On a cold cache that reaches every module's source host, and it hung for over seven minutes where one did not answer. The viewer's `@codesweep-ai/ui` pin moves the same way, through `scripts/repin-npm.mjs`, and `scripts/with-npmrevs.sh` serves none of the packages the store holds.","notes":[],"links":[]},{"id":"TRC-045","title":"A -dirty ui pin passes the pin check, and fails only in CI","type":"defect","severity":"low","status":"closed","foundBy":"agent review (session): `npm run registry:pack` on a tree with changes packs a -dirty build, and nothing stops a pin on one before CI fails on it","opened":"2026-09-25","resolved":"2026-09-25","stint":"local-builds","evidence":{"commits":["eea52d9"],"integrated":[],"verified":"In a scratch clone, the @codesweep-ai/ui version apps/viewer/package.json pins was given a `-dirty` suffix. Then `go run scripts/consumer-conventions.go` failed with exit status 1. It said the version is a build of a tree with changes, which no CI ever builds and no other machine can install. GitHub CI's `ci` passed on c342fc4."},"resolution":"The pin check rejects a ui version ending in `-dirty` or `+dirty`, and says to pin a build of a commit instead.","details":"`scripts/consumer-conventions.go` accepts any exact version as the ui pin, `-dirty` ones included. `npm run registry:pack` on a tree with changes packs such a build. A pin on one installs on the machine that made it and nowhere else, since no CI ever builds that version. CI then fails with E404, long after the commit.","notes":[],"links":[]},{"id":"TRC-046","title":"Installs through cs-npmrevs fail once the build store holds enough npm packages","type":"defect","severity":"med","status":"closed","foundBy":"session agent, investigating campaign's failed `make repin` of 2026-09-29","opened":"2026-09-29","resolved":"2026-09-29","stint":"2026-09-29 npm build store","evidence":{"commits":["c4fe468"],"integrated":[],"verified":"Against a stand-in server that exits at once, `with-npmrevs.sh` failed in 0.35 s and printed its log. Against one that took 24 s to listen, it waited and ran the command. Campaign's `make repin`, rerun with these scripts against the same unpruned store, moved the `@codesweep-ai/ui` pin and rebuilt the viewer in 31 s. In dashboards, tests/test_record_build.py passes 18 of 18 against this record-build.sh, byte for byte, and its prune test fails against the previous copy. Run over a copy of the owner's store, the prune took npm/ from 179 packages (311 MB) to 47 (83 MB), keeping each project's three newest. In ui, scripts/repin-npm.test.mjs passes 18 of 18 against this repin-npm.mjs, and its test for a build whose package is gone fails against the previous copy."},"resolution":"`scripts/with-npmrevs.sh` now waits as long as the registry runs, up to a minute, and stops at once if it exits. Each recorded build removes the npm packages of older ones. A project keeps them for its three newest builds recorded within three days, and for its newest whatever its age. Entries, modules and images stay, and a store that is a repository, as a campaign's is, is left whole. `scripts/repin-npm.mjs` passes over a build whose package the store no longer holds.","details":"`scripts/with-npmrevs.sh` starts cs-npmrevs and gave it 50 checks, about 10 seconds, to answer. The registry reads every package it serves before it listens, and it serves the owner's build store, where nothing removed old npm packages. By 2026-09-29 the store held 179 packages (311 MB), startup took about 9 seconds, and campaign's `make repin` failed with `the registry did not come up`. Each clean `make ci` in lint, ledger or npmrevs adds five more packages, and `npm run ci` in ui adds one.","notes":[],"links":[]},{"id":"TRC-047","title":"Claude Opus 5.5 sessions are priced as Claude Opus 5, at more than twice their real cost","type":"defect","severity":"high","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`pricing.json` has no entry for `claude-opus-5-5`. A model name is matched by the longest table key it contains, so Opus 5.5 falls to the `claude-opus-5` entry.\n\nThe provider's price page, fetched on 2026-09-29, lists Opus 5.5 at $4 input and $20 output per million tokens. Its 5-minute and 1-hour cache writes cost $5 and $8, and its cache reads $0.20. Those are 0.8 times the Opus 5 rates, except cache reads, which Opus 5.5 prices at 0.05 times base input rather than 0.1. Fast mode is $8 input and $40 output, where Opus 5 charges $10 and $50.\n\nCache reads are most of a long agentic session, so the error is most of the estimate. On one host, six trajectories on Opus 5.5 held 658 million tokens. The estimate for them is $398, and their list price is $188.\n\nSome Claude Code records name the model `claude-opus-5-5[1m]`, which a `claude-opus-5-5` key also matches.\n\nThe fix is a `claude-opus-5-5` entry with those rates, a fast mode at $8 and $40 with the cache multipliers on top, and the US multiplier. TRC-006 was the same fault on Claude Fable 5.1.","notes":[],"links":["TRC-006"]},{"id":"TRC-048","title":"GPT-5.6 Sol sessions are priced at $5 and $30 per million tokens, where the provider now lists $4 and $20","type":"defect","severity":"med","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The `gpt-5.6-sol` entry charges $5 input, $0.50 cached input, $6.25 cache writes and $30 output per million tokens. Those rates were read from the provider's page on 2026-08-03.\n\nThe page fetched on 2026-09-29 lists $4, $0.40, $5 and $20 for the short-context tier. A note on it says the model's promotional pricing is available at least through November 21, 2026. The page does not say when the promotion began.\n\nOn one host, 60 Codex trajectories on this model held 22 million tokens. The estimate for them is $19.66. At the current list rates they cost $15.27, which is 29% less.\n\nDated rates can carry the promotional period once its start is known. The entry needs checking again after 2026-11-21.","notes":[],"links":[]},{"id":"TRC-049","title":"A model the price table does not list is priced silently at the rates of a shorter model name it contains","type":"improvement","severity":"med","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The estimator prices a model by the longest table key contained in its name. A new model whose name extends an existing key therefore inherits that model's rates. Nothing says so, and the estimate looks normal.\n\nThis has now gone wrong twice. Claude Fable 5.1 took Claude Fable 5's cache-read rate, which TRC-006 fixed. Claude Opus 5.5 takes all of Claude Opus 5's rates, at more than twice its cost (TRC-047). Claude Sonnet 5.5 takes Claude Sonnet 5's rates, and is right only because the two are equal. A Kimi K3 variant whose id contains `kimi-k3` would be priced at the base model's rates, which are a third below the Fast and US variants' price.\n\nA name that matches a key only because it adds a version or a variant suffix should get no estimate, or at least a warning on the trajectory. That keeps the table's own rule, which prefers no estimate to a wrong one.","notes":[],"links":["TRC-006","TRC-047"]},{"id":"TRC-050","title":"The GPT-5.6 long-context tier can now be priced, because the provider publishes its 272K threshold","type":"improvement","severity":"low","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"`pricing.json` records OpenAI's long-context tier as unrepresentable, because the threshold that separates the tiers was unpublished. The provider's page fetched on 2026-09-29 now states it: short context is up to 272K input tokens, and long context is anything above.\n\nOn the GPT-5.6 models, long context costs twice the input, cached-input and cache-write rates, and 1.5 times the output rate. GPT-5.6 Sol, for example, is $8, $0.80, $10 and $30 per million tokens above the threshold. GPT-5.4 and GPT-5.4 Pro have a long-context tier as well.\n\nThe tier is decided per request, so pricing it needs each call's input tokens rather than a trajectory's totals. The codex adapter already records usage per call.\n\nNone of the 384 Codex calls on the host that found this crossed 272K. In a longer session, calls above it are estimated at as little as half their cost.","notes":[],"links":[]},{"id":"TRC-051","title":"The price table has no rows for Claude Sonnet 5.5, the GPT-6 models, or GPT-5.2 and earlier","type":"improvement","severity":"low","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The provider pages fetched on 2026-09-29 list models that `pricing.json` does not.\n\nClaude Sonnet 5.5 is $2 input, $2.50 and $4 for cache writes, $0.20 for cache reads and $10 output per million tokens. Its name contains `claude-sonnet-5`, whose rates are the same, so it is priced correctly by coincidence (TRC-049).\n\nOpenAI lists four GPT-6 models, each with a short-context and a long-context tier. Short context, in input, cached input, cache writes and output per million tokens:\n\n| Model | Input | Cached input | Cache writes | Output |\n|---|---|---|---|---|\n| `gpt-6-astra` | $10 | $1 | $12.50 | $50 |\n| `gpt-6-sol` | $2 | $0.20 | $2.50 | $10 |\n| `gpt-6.1-sol` | $2 | $0.10 | $2.50 | $10 |\n| `gpt-6-luna` | $0.10 | $0.01 | $0.125 | $0.50 |\n\nIt also lists `gpt-5.2`, `gpt-5.1`, `gpt-5`, `gpt-5-mini` and `gpt-5-nano`. None of these names contains a table key, so their sessions get no estimate. No session on the host that found this used any of them.","notes":[],"links":["TRC-049"]},{"id":"TRC-052","title":"The Fireworks rows were read on 2026-08-03, and the Fireworks price page has changed since","type":"improvement","severity":"low","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The Fireworks entries were read on 2026-08-03. The price page fetched on 2026-09-29 differs from them in three ways.\n\nIt no longer lists 12 of the table's 16 Fireworks models: `kimi-k2p7-code`, `kimi-k2p6`, `kimi-k2p6-turbo`, `deepseek-v4-pro`, `deepseek-v4-flash`, `deepseek-v4-flash-0731`, `glm-5p2`, `glm-5p1`, `glm-5p1-fast`, `qwen3p7-plus`, `minimax-m2p7` and `gpt-oss-20b`. They may be retired, and their rates can no longer be checked there.\n\nIt lists models the table does not have: DeepSeek V4.1 Flash, GLM 5.3, GLM 5.3 Flash, Qwen 3.8 Max, Ember-1 and NVIDIA Nemotron 3.5 Lightning.\n\nIt lists Kimi K3 Fast and a US-hosted Kimi K3, both at $4.50 input, $0.45 cached input and $22.50 output per million tokens. If their model ids contain `kimi-k3`, they are priced at Kimi K3's $3, $0.30 and $15 (TRC-049).\n\nThe four rows still listed, `kimi-k3`, `minimax-m3`, `gpt-oss-120b` and `nemotron-3-ultra-nvfp4`, match the page. The page was read through a fetch tool that summarizes, so check the absences by hand before removing any row.","notes":[],"links":["TRC-049"]},{"id":"TRC-053","title":"Models older than Claude 4.6 carry a US-inference price multiplier they cannot incur","type":"defect","severity":"low","status":"open","foundBy":"session agent, auditing `pricing.json` against the provider price pages fetched on 2026-09-29; filed at the host's request: \"file ledger entries in the tracer repo to report any issues with the pricing\"","opened":"2026-09-29","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"The entries for Claude Opus 4.5, 4.1 and 4, Sonnet 4.5 and 4, Haiku 4.5 and Haiku 3.5 carry `geoMultipliers: {\"us\": 1.1}`. The provider's price page fetched on 2026-09-29 applies that multiplier to Claude 4.6 and later models only. It says earlier models reject `inference_geo` with a 400.\n\nA transcript on those models cannot record US inference, so no estimate is wrong today. The entries still state a price the provider does not charge, and another tool that reads the table would inherit the error.","notes":[],"links":[]},{"id":"TRC-054","title":"A Claude Code workflow's journal is exported as a session of its own","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while exporting a Claude Code 2.1.312 session that ran a workflow of 83 agents","opened":"2026-11-02","resolved":"2026-11-02","stint":"2026-11-02 workflow runs","evidence":{"commits":["9199070"],"integrated":[],"verified":"`go test ./internal/normalizer/ -count=1 -run TestNormalizeDirectoryPassesOverAWorkflowJournal`: PASS. With the predicate stubbed to false the same test fails with `documents = 2, skipped = 0, want 1 and 0`. The authored workflow-run fixture (19d47fc) reproduces it. The build before the change normalizes it to 4 trajectories, unknown-session among them, with no labels, no spawn stamps and unrecognized records throughout. On the session that found it (Claude Code 2.1.312, one root, 1 sub-agent, a workflow of 83 agents), `cs-tracer normalize` at 19d47fc writes 85 trajectories with one root. All 84 children carry a label and a parentEventIndex, the 83 workflow agents point at event 76, which is the Workflow call, and parse.unrecognized sums to 0. The installed build before these changes wrote 86 trajectories, no labels, no workflow stamps and 1,315 unrecognized records. `make ci` with CS_TRACER_CHROMIUM=/usr/bin/google-chrome passes: parity PASS, fixture suite 27 ok and 9 met, and schema conformance passes over the committed and fresh output."},"resolution":"Discovery passes over the `journal.jsonl` Claude Code keeps in each `subagents/workflows/\u003crunId>/` folder, and only there. SPEC.md §4 and the manual's file table say so.","details":"Claude Code stores a workflow's agents under `\u003csession>/subagents/workflows/\u003crunId>/`, beside a `journal.jsonl` that records each agent starting and returning. Discovery reads that journal as a transcript. It becomes a root trajectory named `unknown-session`, with one unrecognized `meta` event per journal line.\n\nIn the session that found it, the journal added a 167-event trajectory to an index of 85 real ones. Nothing marks it as anything other than a session. The journal is the workflow's own bookkeeping, not a conversation, so it should not reach the index.","notes":[],"links":["TRC-056"]},{"id":"TRC-055","title":"A sub-agent's description is ignored, so sub-agents are titled with their first prompt","type":"improvement","severity":"med","status":"closed","foundBy":"session agent, while exporting a Claude Code 2.1.312 session that ran a workflow of 83 agents","opened":"2026-11-02","resolved":"2026-11-02","stint":"2026-11-02 workflow runs","evidence":{"commits":["1cc3a8b","26df952","5228524"],"integrated":[],"verified":"`go test ./internal/normalizer/ -count=1 -run TestNormalizeDirectoryLabelsSubAgentsFromTheirSidecar`: PASS, and it fails without the change with `label = \u003cnil>`. The golden diff in 26df952 adds `meta.label` to the five sub-agents whose sidecar carries a description, and changes nothing else. The fixture suite's TF-01 and TF-27 moved with it and were re-frozen in 5228524. On the session that found it (Claude Code 2.1.312, one root, 1 sub-agent, a workflow of 83 agents), `cs-tracer normalize` at 19d47fc writes 85 trajectories with one root. All 84 children carry a label and a parentEventIndex, the 83 workflow agents point at event 76, which is the Workflow call, and parse.unrecognized sums to 0. The installed build before these changes wrote 86 trajectories, no labels, no workflow stamps and 1,315 unrecognized records. `make ci` with CS_TRACER_CHROMIUM=/usr/bin/google-chrome passes: parity PASS, fixture suite 27 ok and 9 met, and schema conformance passes over the committed and fresh output."},"resolution":"A Claude Code sub-agent carries its sidecar's `description` as `meta.label` (R87), which the index already prefers over the first-prompt title. Each agent in a workflow now reads as its own step, such as `verify:schema.sql`.","details":"Each Claude Code sub-agent has a `.meta.json` sidecar carrying the `description` its parent gave it, such as `Write rule characterization tests`. Discovery reads the sidecar only for `toolUseId`, and `meta.label` stays unset, although the viewer would show it.\n\nThe lane is titled instead with the first 60 characters of the agent's prompt. For a workflow every agent shares the harness preamble, so all 83 agents in one run read `[Workflow harness — user request] The harness relays,…` and cannot be told apart in the index.","notes":[],"links":[]},{"id":"TRC-056","title":"A workflow's agents are not joined to the tool call that launched them","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while exporting a Claude Code 2.1.312 session that ran a workflow of 83 agents","opened":"2026-11-02","resolved":"2026-11-02","stint":"2026-11-02 workflow runs","evidence":{"commits":["b3133ad","d6d00c3","19d47fc"],"integrated":[],"verified":"`go test ./internal/normalizer/ -count=1 -run 'TestClaudeWorkflowCallKeepsItsRunID|TestNormalizeDirectoryJoinsWorkflowAgentsToTheirCall'`: both PASS, and both fail without the change. In the workflow-run golden both agents carry parentEventIndex 2, the Workflow call, whose tool carries runId wf_5c2e81d0-a3f. On the session that found it (Claude Code 2.1.312, one root, 1 sub-agent, a workflow of 83 agents), `cs-tracer normalize` at 19d47fc writes 85 trajectories with one root. All 84 children carry a label and a parentEventIndex, the 83 workflow agents point at event 76, which is the Workflow call, and parse.unrecognized sums to 0. The installed build before these changes wrote 86 trajectories, no labels, no workflow stamps and 1,315 unrecognized records. `make ci` with CS_TRACER_CHROMIUM=/usr/bin/google-chrome passes: parity PASS, fixture suite 27 ok and 9 met, and schema conformance passes over the committed and fresh output."},"resolution":"The adapter keeps a Workflow call's `toolUseResult.runId` as `tool.runId`, and the join stamps each agent stored under `subagents/workflows/\u003crunId>/` with that call's index (R88). The schema declares the field as optional. The fixture scrubber now keeps `runId`, since a redacted one would sever the join.","details":"A direct sub-agent's sidecar names the tool call that spawned it, so its trajectory carries `parentEventIndex` and the index draws a connector from that call. A workflow agent's sidecar carries no `toolUseId`. The agents of a workflow therefore sit under their session with no spawn position.\n\nThe join is recoverable. The `Workflow` call's result carries `toolUseResult.runId`, such as `wf_11f49915-5fe`, and the agents live under `subagents/workflows/\u003crunId>/`. Neither is read today.","notes":[],"links":["TRC-054"]},{"id":"TRC-057","title":"Claude Code's API request records are reported as unrecognized","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while exporting a Claude Code 2.1.312 session that ran a workflow of 83 agents","opened":"2026-11-02","resolved":"2026-11-02","stint":"2026-11-02 workflow runs","evidence":{"commits":["84b2dd0"],"integrated":[],"verified":"`go test ./internal/normalizer/ -count=1 -run TestClaudeAPIRequestRecordsAreIgnored`: PASS, and it fails without the change. No existing golden moved. The authored workflow-run fixture (19d47fc) reproduces it. The build before the change normalizes it to 4 trajectories, unknown-session among them, with no labels, no spawn stamps and unrecognized records throughout. On the session that found it (Claude Code 2.1.312, one root, 1 sub-agent, a workflow of 83 agents), `cs-tracer normalize` at 19d47fc writes 85 trajectories with one root. All 84 children carry a label and a parentEventIndex, the 83 workflow agents point at event 76, which is the Workflow call, and parse.unrecognized sums to 0. The installed build before these changes wrote 86 trajectories, no labels, no workflow stamps and 1,315 unrecognized records. `make ci` with CS_TRACER_CHROMIUM=/usr/bin/google-chrome passes: parity PASS, fixture suite 27 ok and 9 met, and schema conformance passes over the committed and fresh output."},"resolution":"`api-request`, `api-request-blob`, `api-request-shape` and `tools-used` are on the Claude adapter's ignore list (R37). They are counted in `parse.skippedByType` rather than shown as events.","details":"Claude Code 2.1.312 writes `api-request`, `api-request-blob` and `api-request-shape` records, and a `tools-used` record per turn. None carries a `uuid`, and the adapter classifies none of them. Each becomes a visible `meta` event and a `parse.warnings` entry (R38).\n\nIn the session that found it they were 1,148 of the 3,193 events across the 86 trajectories exported. Every lane carried an `unrecognized` badge, which hides a record type that is genuinely new. The records restate the requests the transcript already shows, so they belong in the ignore list (R37).","notes":[],"links":[]},{"id":"TRC-058","title":"An OpenCode 2 session normalizes to zero events, so the viewer draws none of them","type":"defect","severity":"med","status":"closed","foundBy":"session agent, rendering a cs-campaign archive of an OpenCode 2.2.5 member on 2026-11-07: every session file was skipped as `normalized to zero events (adapter: opencode)`","opened":"2026-11-07","resolved":"2026-11-07","stint":"cc/opencode-store, 2026-11-07","evidence":{"commits":["2b7d0e7"],"integrated":[],"verified":"`make ci` passed with exit 0 at 0b15909, every gate run, with the Playwright Chromium named for the parity gate. `go test ./internal/normalizer/ -run TestOpenCodeStore -count=1`: four tests PASS. TestOpenCodeStoreGeneration2 reads a generation-2 store file into eight events: user, system, thinking, two tool calls, a step finish, an assistant reply and a turn end. The spawn is linked to its child, and the step's tokens and cost sit on its last event. TestOpenCodeStoreGeneration1ReadsAsTheExport marshals the same session read as a store file and as the CLI's export and finds the meta, events, totals and parse equal. Against the previous adapter both store files normalize to zero events. The fixture `opencode/v2.2/multi-agent-run`, an archived OpenCode 2.2.5 member, normalizes to 8 trajectories with 210 events and 83 tool calls. Its six children each carry a parentEventIndex at their parent's `subagent` call. The fixture `opencode/v1.18/store` normalizes to the same 96 events as that session's own export."},"resolution":null,"details":"The opencode adapter reads the shape OpenCode 1.18's `session export` writes: `info` beside `messages`, each message as `info` and `parts`. OpenCode 2.2.5's export is not that. Each of its messages holds only `id`, `time`, `text` and `type`, with no part, tool call, model, cost or token count. The adapter finds no part in any message, emits no event, and the file is skipped.\n\nThe whole record is in the CLI's SQLite store, in `session_message.data`. An assistant row there holds its `content` parts, its `model`, `finish`, `cost` and `tokens`. cs-campaign's archive now writes each session as a store file, on either generation. The file holds `store`, naming the generation, the `session` row, and the message rows with their `data` parsed and their part rows attached. The adapter should read that file.","notes":[{"date":"2026-11-07","text":"The adapter reads both store generations into the one form its message loop takes. A generation-1 row is the export's message info with its part rows beside it. A generation-2 row's `content` gives its parts, and its `finish` is read as the step-finish OpenCode 1 wrote."}],"links":[]},{"id":"TRC-059","title":"A Codex 0.165 child cannot point back at the call that spawned it","type":"defect","severity":"med","status":"closed","foundBy":"user report (host), reading a cs-campaign viewer site on 2026-11-07: \"Opencode shows where they were forked from... but Claude and Codex dont\"","opened":"2026-11-07","resolved":"2026-11-07","stint":"cc/opencode-store, 2026-11-07","evidence":{"commits":["e2be335"],"integrated":[],"verified":"`make ci` passed with exit 0 at 0b15909. `go test ./internal/normalizer/ -run TestNormalizeCodexSubAgentActivityItemJoinsTheSpawn -count=1`: PASS. The test feeds a `spawn_agent` call and the `SubAgentActivity` item that names its child, and the spawn event carries `childSessionId` t2 and the command `spawn /root/state_checks`. Without the change the spawn carries no child and the item is an unrecognized meta event. The tracer reads the fixture `codex/v0.165/multi-agent-run`, an archived Codex 0.165 member, into 6 trajectories. Its four children each carry a parentEventIndex at the parent's spawn call, at events 18, 21, 24 and 27, and the directory test checks those four stamps. TestNormalizeCodexCollabSpawnNoticeNamesTheChild: PASS, the v1 shape written from the source, with no v1 capture behind it."},"resolution":null,"details":"The codex adapter learns which child a `spawn_agent` call started from the `sub_agent_activity` event Codex 0.146 writes, keyed by the call's id. Codex 0.165 writes no such event. It reports the start and end of a sub-agent as an `item_completed` event whose item is a `SubAgentActivity`. That item carries the spawning call's id as its own id, the child's `agent_thread_id` and its `agent_path`. The spawn call's own output names the task alone. So no spawn event carries a `childSessionId`, and the tree stamps no `parentEventIndex` on the child. The viewer's index draws the child under its parent with no way back to the call. The child still names its parent from its own `session_meta`.","notes":[{"date":"2026-11-07","text":"Multi-agent v1 on 0.165 writes neither record. Its spawn's notice is a `CollabAgentToolCall` item whose `receiver_thread_ids` are the threads it started, read from the 0.165 source, so the adapter now takes the child from there too. No v1 capture exists yet to confirm the shape; the `wait` notices of this run's v2 capture show the struct."}],"links":[]},{"id":"TRC-060","title":"Codex 0.165 writes three record types the adapter does not know","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reading the goldens of the new fixture codex/v0.165/multi-agent-run on 2026-11-07","opened":"2026-11-07","resolved":"2026-11-07","stint":"cc/opencode-store, 2026-11-07","evidence":{"commits":["8eee961","0b15909"],"integrated":[],"verified":"go test ./internal/normalizer -count=1 -run 'TestNormalizeCodexTokenUsageRecordIsTalliedNotCounted|TestNormalizeCodexAdditionalToolsIsTalliedNotRendered|TestNormalizeCodexAbortedTurnIsAnError|TestFixturesLeaveAlmostNothingUnrecognized|TestOracleTrees': all PASS. The regenerated golden of codex/v0.165/multi-agent-run reports parse.unrecognized 0 in all six rollouts, where the root reported 20 and the children 7 to 14. Nothing outside that golden moved."},"resolution":"`token_usage_record` and `additional_tools` are tallied under their own types, since each repeats what the adapter already reads from `token_count` and the tool calls. `turn_aborted` becomes a turn end marked as an error, with the reason as its label. A new test fails the suite when any fixture leaves more than 2% of its events unrecognized.","details":"A Codex 0.165 rollout carries `token_usage_record` records, one `response_item` of type `additional_tools`, and `item_completed` notices whose item is a `CollabAgentToolCall`. The adapter renders each as an unrecognized meta event, 25 in the root of `fixtures/codex/v0.165/multi-agent-run` when filed. Each needs a reading or a named skip. `token_usage_record` may carry the per-turn usage that `token_count` carries today.","notes":[{"date":"2026-11-07","text":"The `CollabAgentToolCall` notices are tallied under their type since e2be335. `token_usage_record` and `additional_tools` remain."},{"date":"2026-11-07","text":"`token_usage_record` is the richer source: it carries the response id and the turn and thread totals. The adapter keeps reading `token_count` so that no golden outside 0.165 moves."},{"date":"2026-11-07","text":"A survey of the archives on the box found two more Codex notices drawn as unrecognized: `item_completed` items of type `ImageView` (0.148 onward) and `Extension` (kinds `web.search` and `clock.sleep`). Each follows the exec script or `sleep` call that ran it, which the adapter draws, so both are tallied since 8eee961 and 8eee961, the extension under its kind. The same survey found `token_usage_record` at 32% of the events of two Codex 0.157.1 archives, and the skip holds there too."}],"links":["TRC-059"]},{"id":"TRC-061","title":"Claude Code renders a fork's task as an unrecognized content block","type":"defect","severity":"low","status":"closed","foundBy":"survey of the archives on the box, relayed by the coordinating session on 2026-11-07","opened":"2026-11-07","resolved":"2026-11-07","stint":"cc/opencode-store, 2026-11-07","evidence":{"commits":["8eee961"],"integrated":[],"verified":"go test ./internal/normalizer -count=1 -run 'TestClaudeToolResultBesideTextIsTheForkInstruction|TestOracleTrees': both PASS. git status after the change shows no file under oracle/ moved."},"resolution":"A text block beside a tool_result in a user record is read as a user event, after the results are attached to their calls.","details":"Claude Code 2.1.283 writes the first record of a worker fork as a `user` record with two content blocks. A `tool_result` block answers the Fork call, and a `text` block beside it carries the fork's task prompt. The adapter read arrays of results and arrays of text, and drew the mixed form as an unrecognized `user-content:text` meta event. The one instruction a fork acts on was lost from its trajectory. Seven such records exist in the sub-agent files of the archives on the box.","notes":[],"links":[]}],"drafts":[],"queue":{"recommendedBy":"session agent, after the pricing audit of 2026-09-29","updated":"2026-09-29","items":[{"id":"TRC-047","why":"Every Claude Opus 5.5 session is estimated at more than twice its list price."},{"id":"TRC-049","why":"The same silent inheritance will misprice the next model that extends an existing name."},{"id":"TRC-048","why":"GPT-5.6 Sol sessions are estimated 29% above the current list price."}]},"description":"cs-tracer: turns AI coding-CLI session transcripts into a self-contained browsable trace viewer. Open records are behaviours the format does not specify, and gaps the gates do not cover.","links":[],"commitUrlTemplate":null,"rendererVersion":"0.7.5","uiVersion":"0.3.1-dev.20261029181327.893b2b0","lastActivity":"2026-11-07","derived":{"terminalStatuses":["closed","wont-fix","moved-to-roadmap"],"lastActivity":{"TRC-001":"2026-08-16","TRC-002":"2026-08-17","TRC-003":"2026-08-17","TRC-004":"2026-08-17","TRC-005":"2026-09-22","TRC-006":"2026-09-19","TRC-007":"2026-09-19","TRC-008":"2026-09-19","TRC-009":"2026-09-20","TRC-010":"2026-09-20","TRC-011":"2026-09-20","TRC-012":"2026-09-21","TRC-013":"2026-09-21","TRC-014":"2026-09-21","TRC-015":"2026-09-21","TRC-016":"2026-09-21","TRC-017":"2026-09-21","TRC-018":"2026-09-21","TRC-019":"2026-09-21","TRC-020":"2026-09-21","TRC-021":"2026-09-21","TRC-022":"2026-09-21","TRC-023":"2026-09-21","TRC-024":"2026-09-21","TRC-025":"2026-09-21","TRC-026":"2026-09-21","TRC-027":"2026-09-21","TRC-028":"2026-09-22","TRC-029":"2026-09-22","TRC-030":"2026-09-22","TRC-031":"2026-09-22","TRC-032":"2026-09-22","TRC-033":"2026-09-21","TRC-034":"2026-09-22","TRC-035":"2026-09-22","TRC-036":"2026-09-22","TRC-037":"2026-09-22","TRC-038":"2026-09-22","TRC-039":"2026-09-22","TRC-040":"2026-09-23","TRC-041":"2026-09-23","TRC-042":"2026-09-23","TRC-043":"2026-09-25","TR
