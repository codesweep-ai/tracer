  <body>
    <script id="ledger-data" type="application/json">{"project":"tracer","staleAfterDays":90,"records":[{"id":"TRC-001","title":"Initial implementation","type":"improvement","severity":"low","status":"open","foundBy":"the repository's first commit","opened":"2026-08-16","resolved":null,"stint":null,"evidence":{"commits":[],"integrated":[],"verified":null},"resolution":null,"details":"Turn the session transcripts your AI coding CLI leaves on disk into one self-contained HTML page you can read, keep, mail or publish.","notes":[],"links":[]},{"id":"TRC-002","title":"The all-skipped summary says \"reported above\" and printed before the lines it counts","type":"defect","severity":"low","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["385a334"],"integrated":[],"verified":"TestAllSkippedSummaryFollowsTheLinesItCounts normalizes a directory of two unparseable files and asserts the two skip lines come first. Against the previous code it fails, printing the summary at index 0."},"resolution":null,"details":"A directory whose files hold no conversation prints, on stderr, in this order:\n\n```\n0 sessions normalized (1 file(s) skipped, reported above)\nskipping zero-events/notasession.json: normalized to zero events (adapter: claude-code) — not a session file\n```\n\nThe summary refers to lines that follow it. `internal/normalizer/tree.go` appended the summary to the diagnostics and then sorted the slice, and \"0\" sorts before \"skipping\".","notes":[],"links":[]},{"id":"TRC-003","title":"The gate fails on two tools no document named, and skips a third the same way","type":"defect","severity":"med","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["c58a0fc"],"integrated":[],"verified":"`env PATH=/usr/bin:/bin:/usr/local/go/bin make check` reported `FAIL golangci-lint` beside `SKIP npm is not installed`. CONTRIBUTING.md now names both linters with the pinned version CI installs, and the cs-ledger install line beside the ledger paragraph."},"resolution":null,"details":"CONTRIBUTING.md tells a contributor to run `make check`, and says \"A gate that cannot run here reports SKIP and still exits 0\". `scripts/check.sh` runs `golangci-lint` and `deadcode` beside gofmt and vet on purpose. Its comment says \"a gate that quietly skips is one nobody notices has stopped running\", so a machine without them gets FAIL rather than SKIP. No document named either tool or how to install it.\n\nThe ledger gate is the documented behaviour: absent `cs-ledger`, the script skips it and prints the `go install` line. That line was in the script and in no document, so an agent routed to the ledger doctrine by AGENTS.md could not find where the tool comes from.","notes":[],"links":[]},{"id":"TRC-004","title":"The verification step in INSTALL quoted an export size 12 KB out of date","type":"defect","severity":"low","status":"closed","foundBy":"session agent, following README.md and INSTALL.md as a first-time reader","opened":"2026-08-17","resolved":"2026-08-17","stint":"2026-08-17 documentation walkthrough","evidence":{"commits":["38ebb03"],"integrated":[],"verified":"Ran the block verbatim: the binary printed 379.7 KB where the page said 391.8 KB. The sample now elides the size and says why."},"resolution":null,"details":"INSTALL.md §2 walks a two-line demo session end to end and shows `will be 391.8 KB` and `wrote /tmp/demo.html (391.8 KB)`. The current binary prints 379.7 KB for that same session.\n\nThe number is almost entirely the compiled viewer, so it moves whenever the viewer does. A reader comparing their output against the page sees a mismatch on the step whose whole job is to confirm the install worked.","notes":[],"links":[]},{"id":"TRC-005","title":"A site built over several directories cannot say which directory a session came from","type":"improvement","severity":"med","status":"closed","foundBy":"session agent working in the simple-tools-demo repository, which runs a three member campaign at the pinned build of 2026-09-17, while reading the trajectories of three campaign members","opened":"2026-09-19","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["53b38da","d941c25","ed1b53d","6f8208b","e0ddc4f"],"integrated":[],"verified":"Headless loads of the rebuilt sites. The codex corpus, read from three dated directories, shows three groups on its index, holding 8, 8 and 20 of its rows, and a Collapse all control. A synthetic site over directories a, b and c groups its seven sessions as 1, 3 and 3, with each sub-agent under its parent. Sites read from one directory show no group and no control. The old build shows no group on any of them.\n\n`make ci` passes at the last cited commit: parity PASS, and every fixture check passes, 27 ok and 9 met. The regenerated goldens differ from the last ones only by the new field. Two fixture moves were approved against this record: the input grows 16 bytes per trajectory, and the index counts sessions where it counted lanes. The maintainer looked at the codex site and agreed it was right."},"resolution":"Every trajectory now records the directory it was read from, relative to the directory the tool was given (R83). When the top-level trajectories come from more than one directory, the index groups them under a heading naming each, with each child under its parent. The groups start open, fold away under their heading, and one control folds or opens them all. A site read from one directory looks as it did. The index also counts sessions rather than lanes, since a lane also names a strip row.","details":"`cs-tracer \u003cpath> --split` builds one index over every session under `\u003cpath>`. Each row is titled by what the agent CLI called the session. Nothing in a row says where under `\u003cpath>` the session was read from.\n\nA campaign archive holds one directory per member. The members' sessions are titled by their dispatch, for example `Campaign dispatch d002 execution`, and every member reports the same working directory. One site over the archive therefore shows several rows with near identical titles, and no way to tell the orchestrator's session from a member's.\n\n`--links` does not help, because it joins related sessions and does not label them.\n\nThe demo works around this in its Makefile. It runs `cs-tracer` once per member and writes a small index page of its own that names the members. That loses the one page where every session sits side by side with its tokens and cost, which is the view a fleet wants.\n\nThe relative directory a session was read from is already known when the index is built. Showing it as a column, or grouping rows by it, would be enough.\n\nTo reproduce, unpack two members' `transcript/cli-evidence.tgz` from a campaign archive into `src/a` and `src/b`, then run `cs-tracer src --split -o site`.","notes":[{"date":"2026-09-22","text":"Before building, the code was checked for something that already covered this. Only the working directory was recorded, and every member of a campaign reports the same one, so it could not tell them apart."}],"links":[]},{"id":"TRC-006","title":"Claude Fable 5.1 and Claude Mythos 5.1 sessions are billed four times the real cache-read rate","type":"defect","severity":"high","status":"closed","foundBy":"session agent, while auditing the cost estimates in a rendered trace against the provider's published price list on 2026-09-19, at the host's request","opened":"2026-09-19","resolved":"2026-09-19","stint":"pricing-audit","evidence":{"commits":["c8c10ef"],"integrated":[],"verified":"`go test ./internal/normalizer/ -run TestEmbeddedTableCacheReadRates -count=1`: PASS. One million cache reads cost $0.25 on both 5.1 models and $1 on both 5 models. The test fails without the new entries. A real Fable 5.1 session of about 120 million cache-read tokens, normalized with the rebuilt binary, estimated $63.22 where the old table gave more than twice that."},"resolution":"`pricing.json` carries `claude-fable-5-1` and `claude-mythos-5-1` entries with `cacheRead` at 0.25. A `_doc` line says why the two need their own keys.","details":"`pricing.json` has no entry for `claude-fable-5-1` or `claude-mythos-5-1`. A model name is matched by the longest table key it contains, so both fall to the `claude-fable-5` and `claude-mythos-5` entries.\n\nThose entries charge $1 per million cache-read tokens, which is right for the 5 models. The provider's price list charges $0.25 for the 5.1 models, which is 0.025 times base input where every other model pays 0.1 times. Input, output and both cache-write rates are the same across 5 and 5.1.\n\nCache reads are most of the tokens in a long agentic session, so the error is most of the estimate. One audited session of about 100 million cache-read tokens showed an estimate more than twice the correct figure.\n\nTo reproduce, render any Claude Code session whose model is `claude-fable-5-1`. Then multiply its `cacheRead` total by both rates and compare each with the cost shown.\n\nThe fix is an entry for each 5.1 model with `cacheRead` at 0.25. The longest-match rule then picks it over the shorter key.","notes":[{"date":"2026-09-19","text":"The provider's price list was read again on 2026-09-19. Every other Anthropic rate in the table matched it, apart from the Sonnet 5 rates that TRC-007 records."}],"links":[]},{"id":"TRC-007","title":"Sessions on Claude Sonnet 5 from September 2026 are priced at an increase the provider cancelled","type":"defect","severity":"med","status":"closed","foundBy":"session agent, while auditing the cost estimates in a rendered trace against the provider's published price list on 2026-09-19, at the host's request","opened":"2026-09-19","resolved":"2026-09-19","stint":"pricing-audit","evidence":{"commits":["c27c6f6"],"integrated":[],"verified":"`go test ./internal/normalizer/ -run TestEmbeddedTableSonnet5HasNoSeptemberReprice -count=1`: PASS. A million input and a million output tokens cost $12 for a session started in August 2026 and for one started in September 2026. A real Sonnet 5 subagent session from September, normalized with the rebuilt binary, estimated $0.49, which matches a hand sum at the published rates."},"resolution":"The `claude-sonnet-5` entry is one undated rate set at $2 input and $10 output. The dated-rates mechanism stays, and its own test still covers it with a synthetic table.","details":"The `claude-sonnet-5` entry in `pricing.json` carries two dated rate periods. The first runs through 2026-08-31 at $2 input and $10 output per million tokens. The second starts 2026-09-01 at $3 and $15, with the cache rates scaled to match.\n\nThe table was audited on 2026-08-03, when the provider had announced that increase. The provider now says the introductory rate is the standard one, and that the increase will not happen.\n\nEvery Sonnet 5 session started on or after 2026-09-01 is therefore estimated at 1.5 times its real cost.\n\nTo reproduce, render a Sonnet 5 session started in September 2026 and recompute its cost from its token totals at $2, $10, $0.20, $2.50 and $4.\n\nThe fix is one undated rate set at the introductory numbers. The `_doc` line that describes the reprice needs to say what happened instead.","notes":[{"date":"2026-09-19","text":"An announced reprice is a claim about the future. The `_doc` line on dated rates now says to recheck one after its date has passed."}],"links":[]},{"id":"TRC-008","title":"A subagent session's output tokens are counted from a partial usage record","type":"defect","severity":"high","status":"closed","foundBy":"session agent, while auditing the cost estimates in a rendered trace against the provider's published price list on 2026-09-19, at the host's request","opened":"2026-09-19","resolved":"2026-09-19","stint":"pricing-audit","evidence":{"commits":["6fbc45c","a94c025"],"integrated":[],"verified":"`go test ./internal/normalizer/ -run TestClaudeLastUsageRecordForAMessageWins -count=1`: PASS, and it fails against the old adapter with `output = 2, want the final record's 900`. The three subagent goldens moved to 647, 1047 and 3627 output tokens, each equal to an independent sum of the last usage record per message id in its fixture. The golden diff changed only `output`, `cost` and the byte size of the affected events. A real subagent session that had reported 141 output tokens reports 9,356."},"resolution":"The claude adapter overwrites a message's token counts in place each time a later record with the same message id arrives, so the last record wins. The tokens stay on the message's first event and are counted once. The first commit cited is the fix, and the second regenerates the goldens it moved.","details":"Claude Code writes one transcript line per content block, so one API message spans several lines that share a message id. Each line carries a `usage` object. The claude adapter keeps the first `usage` it sees for an id and ignores the rest, so that a message is not counted once per block.\n\nIn a subagent transcript the first line's `usage` is a snapshot taken while the message was still streaming. Its `output_tokens` is a handful. The last line for the same id carries the final count. The input and cache counts are the same on every line.\n\nThe adapter therefore reports a small fraction of a subagent's real output. One audited subagent showed 141 output tokens across 27 tool calls, where the final records sum to 9,356. Every subagent in the audited trace was affected, by factors between 3 and 300. The main session transcripts were not affected, because their lines agree with each other.\n\nOutput is the most expensive token, so the cost estimate is understated too, by 15 to 25 percent on the audited cache-heavy subagents.\n\nTo reproduce, take a subagent transcript and sum `output_tokens` over the last line of each message id. Compare that with the `output` total the tool reports.\n\nThe fix is to count the last `usage` record for each message id rather than the first, while still attaching the tokens to the message's first event.","notes":[{"date":"2026-09-19","text":"The subagent fixtures already held this defect, so the old goldens had recorded the partial counts as expected output. The oracle diff catches change and cannot catch a wrong value that never changed."}],"links":[]},{"id":"TRC-009","title":"A sub-agent lane cannot say where in its parent it was forked from","type":"improvement","severity":"med","status":"closed","opened":"2026-09-20","foundBy":"user report (host), reading a captured export of thirty trajectories: \"when we have a sub-session ... it isn't obvious where in the strip it was forked from. maybe clicking on the blue L should navigate to its fork point?\"","resolved":"2026-09-20","stint":"fork-navigation","evidence":{"commits":["d838e5a","a30f024","539a01f"],"integrated":[],"verified":"`make check` passes with parity enabled. `go test ./internal/normalizer/ -run TestNormalizeDirectoryStampsParentEventIndex`: PASS across five fixtures spanning all three CLIs, with per-fixture counts pinned so a join that stops resolving fails rather than reporting a smaller number. Ten oracle summaries gained `parentEventIndex` and nothing else, verified by removing the key and comparing byte for byte.\n\nA captured export of thirty trajectories was rendered headless and checked. A child spawned by a parent of 1,803 events reports `forked from parent · #742` and links to that parent at `#ev-742`, which is the index measured independently from the parent's own strip. Three sub-agents dispatched in one batch report 740, 741 and 742 separately. Every connector in that export takes the off-screen branch, and each now carries `Forked from event #\u003cn> of the parent trajectory (outside the visible strip)` instead of pointing at nothing."},"resolution":"Three changes. `NormalizeDirectory` stamps `meta.parentEventIndex` on a child when it finds the spawning event, which is the only point where both documents are in hand (R59). The connector becomes a link to the parent at that event, in both its drawn and its off-screen state (R60). Each names the index in its label, so the state that cannot point still says where. The lane repeats the index as text, which needs no geometry and so survives sibling spawns twenty pixels apart. A child's trace page gains the way back, working on a cold load in both export modes because the index is stamped rather than derived.\n\nAbsent stays legal. A child exported without its parent, or one whose spawn cannot be joined, keeps the inert depth connector. The index page prefers the stamp and falls back to the scan it always did, so an export made before this still nests and links correctly.\n\nThe parent is named \"parent\" rather than by its title. Only the reduced index carries a title, so rendering one read differently in the two transports and the parity gate failed on it. The tooltip carries the id.","details":"The index page draws an L-shaped connector from a parent's spawn cell down to the child's lane. It carries no text and it is not clickable. When the spawn cell is scrolled out of the parent strip, it degrades to a stub with no position information at all.\n\nThat last case is the common one, not the edge case. The strip is ten pixels per event, so a parent of 1,800 events is an 18,000 pixel scroller. A spawn at event 740 sits about 7,400 pixels along it. Unless the strip happens to be scrolled there, `ForkConnector` takes its `!anchor.visible` branch and draws `fork-connector-offscreen`, which points at nothing. A reader is told a fork happened and cannot learn where.\n\nAdjacent spawns make it worse. Three sub-agents dispatched in one batch fork at three consecutive events, twenty pixels apart, so even scrolled into view their connectors overlap.\n\nThe reverse direction is missing outright. A child's own trace page offers only the breadcrumb to the index. It never names its parent, and there is no route back to the event that spawned it. In `--split` mode it could not build one: a trace page carries its own summary and a reduced index of `{id, safeId, title}`, so the spawn position is not knowable there. The index page derives it client side by scanning the parent's strip, which only works because that page has every summary loaded.\n\nThree changes, smallest first. Name the index in the connector, so it informs even when it cannot point. Make the connector a link to the parent at that event. Record the spawn position on the child at normalize time, so the child's page can offer the way back in both export modes and on a cold load.","notes":[],"links":[]},{"id":"TRC-010","title":"The fork connector left the page, and a cell reached by navigation landed against the edge","type":"defect","severity":"med","status":"closed","opened":"2026-09-20","foundBy":"user report (host), reading the behaviour shipped for TRC-009: \"the selected square is at the end of the visible window, we should try and center it in the window if there are enough squares after it\", and \"I wanted the link to just navigate the square scrolls, not click off that page\"","resolved":"2026-09-20","stint":"fork-navigation","evidence":{"commits":["ab6303a"],"integrated":[],"verified":"`make check` passes with parity enabled, 60 viewer tests. centerCell has unit cover for the middle case and for both clamps.\n\nThe rest was measured in a real browser, on a captured export. Landing on a parent of 1,803 events at its fork point puts the cell 619 px into an 1,238 px window. That is half way across, where it used to sit against the trailing edge.\n\nClicking the connector on the index leaves the URL unchanged. It scrolls that parent's strip from 0 to 6,994, which puts the cell half way across an 876 px window. The connector's `data-spawn-visible` flips to true, so the stub becomes an L aimed at the cell it just revealed."},"resolution":"The connector is a button rather than a link, and scrolls the parent's strip to the spawn cell without leaving the index (R61). The lane's `forked from #n` link is unchanged and still opens the parent's page, so both intentions are served by separate affordances.\n\nEventLanes scrolls a selection into view minimally, parking a cell against the trailing edge of the viewport. `centerCell` puts it in the middle instead (R62), clamped at both ends so a cell near one stops there rather than centring into blank space.\n\nCentring is raised by navigation only, never by a strip click or a scrollspy update. Moving the strip under a reader who just clicked a cell is the same defect in a different place.","details":"Two faults in the fork navigation shipped for TRC-009, both about where a reader ends up.\n\nThe connector was a link to the parent's trace page. Acting on it therefore left the index, which is the one view that shows every lane side by side. A reader who wants to see where a sub-agent was forked is almost always comparing lanes. The useful answer is to reveal the cell in place, not to open another page.\n\nSeparately, a cell reached by navigation landed in the worst position available. EventLanes scrolls a selection into view minimally, moving just far enough to bring the cell inside the viewport's trailing edge. Everything before the cell is then visible and nothing after it is, which is the opposite of what a reader arriving at a fork point needs. On a parent of 1,803 events the cell sat hard against the border of an 1,238 pixel window.\n\nTo reproduce, export a directory holding a session with sub-agents. Open a child's page, follow the link back to the parent, and look at where the highlighted cell sits.","notes":[],"links":["TRC-009"]},{"id":"TRC-011","title":"Tool inputs rendered as JSON, which destroys the multi-line strings they are made of","type":"improvement","severity":"med","status":"closed","opened":"2026-09-20","foundBy":"session agent, while reading a captured export of thirty trajectories; raised again by the user, who asked for a formatted default with the record still reachable","resolved":"2026-09-20","stint":"fork-navigation","evidence":{"commits":["0795e1d"],"integrated":[],"verified":"`make check` passes with parity enabled. 75 viewer tests, thirteen of them on the renderer, including one that asserts every key of every shape reaches the page.\n\nThe three shapes were checked in a real browser against a captured corpus. A 515-line heredoc renders as shell in a card 513 px tall, with no JSON escapes left except the ones the script itself contains. A 66-line edit renders as a diff with its changed lines marked. A 357-line file write renders as its path and its body."},"resolution":"A shape registry in the viewer (R63). A `command` renders as shell and an old and new pair as a unified diff. A path with content renders as a file body, a bare string as text, and anything unrecognised as labelled fields.\n\nSelection is by input shape, never by tool name (R65). Names differ per CLI, and the fixture scrubber rewrites them to prose, so a table keyed by name could not be exercised by the corpus.\n\nThe formatted view renders every key (R64). Nothing is summarised away, so the toggle beside the kind chips reveals nothing that was withheld, which is what lets formatted be the default. The toggle is session state and is never persisted, because storage under a file URL is an opaque origin.\n\nCode blocks keep their bounded default height. Unbounded blocks would have traded an unreadable card for a card taller than the list holding it.","details":"Every tool call's input reached the page through one `CodeBlock` with `language=\"json\"`. The normalized record carries `tool.input` verbatim, so the viewer had the real data. Every input was drawn the same way regardless of what it held.\n\nThat choice destroys the field worth reading. Almost every tool's payload is a multi-line string, and JSON escaping is exactly what collapses a multi-line string into one line of backslash-n and backslash-quote. In one captured corpus of 3,432 tool calls, 3,159 were shell commands, so the commonest case was the worst served. One of them carried a 515-line heredoc, which arrived as a single unreadable line.\n\nThe same applies to the other shapes. An edit is a diff, and it arrived as two escaped blobs. A file write arrived as one escaped blob. A sub-agent dispatch arrived with its prompt escaped.\n\nTool output has the identical problem and is usually longer. It is deliberately left alone here, because bounding and truncating output is its own question.\n\nTo reproduce, export a session containing a shell command with a heredoc and read the tool call's input.","notes":[],"links":["TRC-009"]},{"id":"TRC-012","title":"A codex turn that failed is reported as a turn that completed","type":"defect","severity":"high","status":"closed","opened":"2026-09-21","foundBy":"the user, who asked whether calls rejected for rate limits would show in the strip; the check that followed found the dropped field","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["0e9883c"],"integrated":[],"verified":"`make check` passes with parity enabled: DOM, pixels and the interaction end state all match across both transports, and prose, refs, oss and surface report no errors. The Go suite passes. A new adapter test asserts that a failed turn carries the flag, the reason and the provider's message. It also asserts that a turn which finished carries none of them. Fifty viewer tests pass, including a new one on the card.\n\nNo golden moved, because no fixture holds a `task_complete` that failed. So the fix was checked against the input that exposed it. Eighteen codex trajectories were re-normalized with the new binary. Twenty three turn_end events now carry `isError`, twenty one reading `rate_limit_exceeded` and two reading `server_overloaded`. All twenty three reach the strip's error channel. Before the change that count was zero."},"resolution":"R67. A record reporting that a turn ended in failure now produces an event marked as an error.\n\nThe adapter reads `error` on `task_complete`. The provider's own sentence becomes the event text, and `codex_error_info` becomes the label, so the machine-readable reason names the cell and the sentence is what a reader sees. A turn that finished still reads \"turn complete\".\n\nAn event carries `isError` when it has no result to report failure through. A tool call keeps reporting through `result.isError`, and `stripEvent` reads either, which is how the failure reaches the strip and the errors-only filter. The field is additive and optional in the schema, so `schemaVersion` is unchanged and older documents still validate (R7).\n\nThe change stays in the codex adapter. The other two adapters were checked against the same corpus. Claude wrote no turn-level failure in it, and opencode already reports one through the tool state its adapter reads.","details":"The codex adapter maps a `task_complete` record to a `turn_end` event and hardcodes its text to \"turn complete\". The record's `error` field is never read.\n\nCodex writes that field when a turn ends in failure. In a captured corpus of twenty codex trajectories, twenty three turns carried one. Twenty one read \"rate limit exceeded\" and two read \"Selected model is at capacity\". Seven of the eight members in that corpus had at least one.\n\nEvery one of those turns normalizes to the text \"turn complete\", and none of the affected trajectories carries a single event marked as an error. A turn that died on a provider limit is therefore drawn exactly like a turn that succeeded. The strip shows no mark, the errors-only filter finds nothing, and the event card states that the turn completed.\n\nThat inverts the meaning of the run. A reader counting successful turns counts the failures among them, and a reader hunting for why a member stalled finds no trace of the reason.\n\nErrors reach the strip only through `result.isError`, which the adapters set on tool calls alone. No adapter carries a turn level failure today, so the same hole exists wherever another CLI reports one.\n\nTo reproduce, normalize a codex session whose `task_complete` payload carries an `error`, then read the resulting turn_end event.","notes":[{"date":"2026-09-21","text":"`totals.toolErrors` counts events whose result failed, so a failed turn is not counted there. The count stays true to its name, and the index badge that renders it will not show these failures. Whether totals should carry a turn-level count is left open."}],"links":[]},{"id":"TRC-013","title":"Idle time has no definition, and turn_end means two different things","type":"defect","severity":"med","status":"closed","opened":"2026-09-21","foundBy":"the user, who asked how the tool should account for time and set the rule that an agent stopping with no tool call is waiting; the checks that followed found the adapters disagreeing","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["7114fc0","3e14f07"],"integrated":[],"verified":"`make check` passes with parity enabled. Fifty viewer tests pass. Three new tests cover the Go side. One asserts that idle lands on turn ends and never on a slow tool call. One asserts that an untimestamped neighbour is stepped over. One covers both step-finish branches.\n\nThat last test exists because no fixture can reach the branch. The scrubber rewrites the reason to prose, so none carries the literal stop.\n\nThe goldens moved and were checked structurally against the previous ones. Four kinds of change appear across twenty seven files and no others. The field idleMs was added in 496 places, and size shifted in 299. The kind changed in 102 places, and turnEnd was removed from 51. The last two are the same 51 step finishes, counted once in a chunk and once in a strip entry.\n\nAgainst 94 captured trajectories holding 26,080 events, opencode fell from 967 turn ends to 40, from 31.6% of its strip to 1.3%. The other three adapters report 0.3%, 0.9% and 3.2%, unchanged, because their turn ends were already real. Idle is now reported on 453 intervals holding 262 hours, where before it was reported nowhere."},"resolution":"R68 now says what idle is. A turn ends when the model returns a response with no tool call pending, and the interval from that event to the next one is idle. Every other interval is work, including a long one after a tool call, which is a slow tool.\n\nOne pass stamps `idleMs`, called from both assembly points, so the three adapters cannot disagree about what idle means. It travels on the event and on its strip entry, so a viewer never subtracts timestamps across neighbours a filter removed. A turn end with nothing after it carries no field rather than a zero.\n\nR69 stops an adapter reporting a turn ending that did not end a turn. An opencode step finish is a turn end only when its reason reads `stop`. The rest read as meta and keep their reason, so the details page still shows what they were.\n\nBoth fields are additive and optional in the schema, so `schemaVersion` is unchanged (R7).","details":"Nothing in the schema or the spec says what idle time is, and no adapter reports it. A reader wanting to know how long an agent sat waiting has to subtract timestamps, and the viewer would have to guess which gaps count.\n\nThe guess is not available either, because `turn_end` does not mean one thing. Claude and codex emit it once to five times per trajectory, at a real boundary. OpenCode emits it for every `step-finish`, which fires after each batch of tool calls. In a captured corpus that is 892 events across twelve trajectories, 31% of every strip, against three real endings per trajectory. Only the step whose reason reads `stop` ends a turn.\n\nTelling them apart today means matching the word `tool-calls` inside the event text. R65 forbids exactly that, and the fixture scrubber rewrites text to prose, so the corpus could not exercise it.\n\nThe cost is not academic. The interval after a real turn ending holds most of the elapsed time. It measured 97.9% in one captured session, and 88% and 55% in aggregate for the two unattended adapters. A tool that cannot name that interval cannot say how long anything took.\n\nA `step-finish` that is not a turn ending is bookkeeping, and it belongs in `meta` with its reason preserved, where the details page still shows what it was.\n\nTo reproduce, normalize an opencode session and count the `turn_end` events against the turns the session actually contains.","notes":[{"date":"2026-09-21","text":"The strip's presence test for a number was wrong at first. `present` stringifies its argument, so it reads every number as absent, and the field reached the event while the strip dropped it. Real output caught what the unit test could not, because the test asserted on the event rather than the strip."}],"links":["TRC-012"]},{"id":"TRC-014","title":"Idle ends at the next record of any kind, so bookkeeping cuts it short","type":"defect","severity":"med","status":"closed","opened":"2026-09-21","foundBy":"session agent, auditing R68 against real output after the user asked whether anything needed redoing","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["66bd3b5","6f665b1"],"integrated":[],"verified":"`make check` passes with parity enabled. Two new tests cover the defect. One asserts that timestamped bookkeeping does not end the wait, over a gap of three hours. The other asserts that a turn end followed only by bookkeeping carries no field.\n\nThe goldens moved in four files, checked structurally against the previous ones. The field idleMs was corrected in four places and removed from four, and size shifted in two, with no other difference. The removals are turn ends after which work never resumed.\n\nAgainst the thirty captured trajectories that exposed it, reported idle rose from 239.2 hours to 292.9, over 401 intervals. That matches the figure measured by hand before the fix, to the tenth of an hour. The codex and opencode corpora report the same totals as before, which is what the defect predicted."},"resolution":"The idle interval now runs from the turn end until work resumes. Work resumes at a user instruction, an assistant message, a thinking step or a tool call. A meta or system record is stepped over, timestamp or not, because it is the agent standing still.\n\nR68 was reworded to say so, and the schema description for `idleMs` with it. A turn end after which work never resumes carries no field, which is the same rule R68 already applied to a turn end with nothing after it.","details":"R68 says the idle interval runs from the event that ends a turn to the next event, and the implementation matches it. Both are wrong about what the next event means.\n\nA record that carries no work does not end the wait. Claude Code writes context attachments and queue operations while the agent sits doing nothing, and each one carries a timestamp. The interval stops at the first of them. A turn that ended at noon and resumed at three reports two seconds of idle, when a bookkeeping record landed two seconds after noon.\n\nMeasured over thirty captured trajectories, 46 of 401 intervals end early. Reported idle totals 239.2 hours against 292.9 hours measured to the next event that does work. Eighteen percent of the waiting is lost.\n\nThe other two adapters show no difference at all, because neither writes anything between a turn ending and the agent resuming. That is what made the defect easy to miss: two of the three corpora agree with the wrong implementation.\n\nThe interval should end at the next event that represents work, meaning a user instruction, an assistant message, a thinking step or a tool call. A meta or system record is the agent standing still, which is the definition of the interval being measured.\n\nTo reproduce, normalize a session where a context attachment follows a turn ending, and compare the stamped idleMs against the gap to the next real event.","notes":[],"links":["TRC-013"]},{"id":"TRC-015","title":"Time between records lands on bookkeeping, so model latency is drawn nowhere","type":"defect","severity":"med","status":"closed","foundBy":"session agent, measuring where elapsed time sits in thirty captured unattended trajectories","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["881c7a7","eca5f0b","471dcf8","49d4e97","8b208cc"],"integrated":[],"verified":"`make check` passes with parity enabled. Four new unit tests cover the rule, and two cover the reclassified records; each of the latter fails without its fix.\n\nThe goldens moved in 57 files, checked structurally against the previous ones. The field workMs was added to 3,439 events and their strip entries, and synthetic to one event, with no other difference beyond size.\n\nAgainst the thirty captured unattended trajectories, time drawn nowhere fell to 0.0% for Claude Code, 2.5% for codex and 0.0% for opencode. No trajectory in those three sets reports an unrecognized record, where codex alone reported 3,404 before."},"resolution":"A thinking step, an assistant message or a tool call now carries `workMs`, the time from the end of the previous work to its own end, stepping over bookkeeping. R70 specifies it, and the schema describes it on the event and the strip entry.\n\nThe codex adapter skips `item_completed` by item type and draws `compacted` as an event. The Claude adapter ignores `atis-latch`, `agent-color` and `relocated` by name. A reply Claude Code wrote without calling a model carries `synthetic` and no work, because one captured session charged such a reply the 37 minutes the user took to return.","details":"No event says how long it took, apart from a tool call's own run time. A reader who wants the time a model response took has to subtract timestamps across neighbours, and most neighbours are bookkeeping.\n\nClaude Code writes a context attachment after nearly every tool result, and codex writes an `item_completed` notice beside every item. The model's latency sits between those records and the reply. Measured over thirty captured trajectories, 8% to 26% of elapsed time belongs to no event even after idle is set aside.\n\nThe codex notices make it worse, because the adapter does not recognize them. They reach the strip as 3,404 unrecognized events, and every codex trajectory carries a warning badge for records that only repeat items the adapter already reads. Claude Code's `atis-latch`, `agent-color` and `relocated` records are flagged the same way, though each carries no timestamp and holds one constant value.\n\nThe time should land on the work that consumed it. A thinking step, an assistant message or a tool call owns the interval from the end of the previous piece of work to its own end, stepping over bookkeeping. A tool call ends when its result arrives.\n\nTo reproduce, normalize a codex session and count the `event_msg:item_completed` warnings.","notes":[{"date":"2026-09-21","text":"The first reading of the rule measured forward from each response, and left 8% to 26% of elapsed time on no event. The user chose the backward interval over it on those figures."}],"links":["TRC-014"]},{"id":"TRC-016","title":"A Claude Code local command ends the idle interval, though the agent never resumed","type":"defect","severity":"med","status":"closed","foundBy":"session agent, looking for the elapsed time that R70 still left on no event in an attended Claude Code session","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["23b6196","092d355"],"integrated":[],"verified":"`make check` passes with parity enabled. A new test on raw records asserts that an echo leaves a two hour wait whole, and that a hand-back still ends one; it fails without the fix.\n\nThe goldens moved in twelve files, checked structurally. Eleven echoes changed kind, the idle and work intervals around them moved, and two derived titles changed, with nothing else.\n\nOn the attended session that exposed it, elapsed time on no event fell from 6.5% of 332 hours to 1.7%."},"resolution":"The Claude Code adapter now reports the echo of a local command as a system event, beside the command that produced it. It recognizes the echo by `isMeta` together with a `local_command` parent, so a hand-back or a task notice still reads as an instruction. The shared idle pass is unchanged. R68 gained a sentence saying that an adapter reports a user instruction only for a message the agent is meant to act on.\n\nTwo fixture sessions opened with an echo, so their derived title now comes from the first message the user sent.","details":"R68 ends the idle interval at a user instruction. The Claude Code adapter reads every `user` record as one, including the ones Claude Code writes itself to echo a local command. Running `/context` or `/cd` while the agent waits writes such a record, and the agent does not reply to it.\n\nSo the wait stops at the command, and the rest of it, up to the next real instruction, is neither idle nor work. In one attended session two such commands left 20.5 hours of 332 on no event. A reader sees a trajectory that was busy while nobody was there.\n\nThe echo carries `isMeta` and names the `local_command` record as its parent. Other records carrying `isMeta` do start work, such as a sub-agent's hand-back or a background-task notice, so the flag alone does not separate them.\n\nTo reproduce, normalize a Claude Code session in which `/context` ran between turns, and compare the turn end's `idleMs` with the gap to the next real instruction.","notes":[],"links":["TRC-014","TRC-015"]},{"id":"TRC-017","title":"A trajectory's cost field holds a reported figure for one CLI and an estimate for the others","type":"defect","severity":"med","status":"closed","foundBy":"user, while reviewing how Claude Code's cost-state record should be handled: \"the normalized model should be able to handle the superset of costs and not be cli dependent, but just dependent on it's schema\"","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["578c4da","7c06b8b","e5b54b8"],"integrated":[],"verified":"`make check` passes with parity enabled, and schema conformance passes on version 3. Four new normalizer tests cover the rule, and six viewer tests cover what is shown and how a total counts a tree.\n\nThe goldens were checked summary by summary against the previous ones. Every one of 22 estimates is unchanged, and each of the 5 OpenCode figures became a reported figure agreeing with its steps. Nothing else changed beyond event sizes.\n\nAgainst the captured corpora, no trajectory reports an unrecognized record or a disagreement. All five attended Claude Code sessions carry a figure covering their tree, between 6% and 13% above tracer's estimates for the same trees. The rendered index totals them once, at $785.34, with no estimate mark."},"resolution":"Schema version 3 turns `totals.cost` into an object with three members. The member `reported` lists each figure the CLI stated, with what it covers, and `reportedByEvents` sums the events' own costs with a count of those priced. The member `estimated` holds tracer's figure, made the same way for every adapter. The adapters leave a member absent when its CLI gives no source for it.\n\nThe OpenCode adapter reports its session figure as covering the trajectory, and warns when it disagrees with its steps. The Claude Code adapter reads the last `cost-state` as covering the tree, with its per-model breakdown. The pricing pass no longer names any adapter.\n\nSPEC section 9 states the rule as R71 to R76. The viewer shows a reported figure first and marks an estimate, and a total counts each tree once.","details":"The field `totals.cost` holds OpenCode's own figure for an OpenCode trajectory and tracer's price-table estimate for the other two adapters. Only `costEstimated` tells them apart, and the index adds both kinds into one total. The shared pricing pass skips OpenCode by name, which is knowledge of one CLI outside its adapter.\n\nThe OpenCode adapter also lets the session's own figure replace the sum of its per-step costs without saying so. The two agree in every captured session, but nothing checks it.\n\nClaude Code writes a `cost-state` record with its own figure, and the adapter reports it as unrecognized. That figure covers the session and its sub-agents together, plus calls never written to any transcript. Stored on one trajectory as that trajectory's cost, it would count the sub-agents twice in any total.\n\nThe schema should hold every cost a CLI reports, named for its provenance and for what it covers, beside tracer's own estimate. An adapter fills what its CLI provides and leaves the rest absent. No field falls back to another. The viewer shows a reported figure where one exists, and otherwise the estimate marked as one.","notes":[],"links":["TRC-006","TRC-007","TRC-008"]},{"id":"TRC-018","title":"A trajectory's duration counts the time nobody was working, overstating one session forty-fold","type":"defect","severity":"med","status":"closed","foundBy":"session agent, measuring elapsed time against work in captured sessions while planning the strip","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["c28a788","332d521","7f3cb80"],"integrated":[],"verified":"`make check` passes with parity enabled. Three new normalizer tests cover the three figures, the span reaching a late tool result, and Claude Code's durations kept as reported. Two viewer tests cover the time label.\n\nThe goldens were checked summary by summary. Each old `meta.durationMs` reappears as `totals.time.elapsedMs`, except where the span moved to a tool result or an earlier stamp. Idle plus work fits inside elapsed time in all 27.\n\nThe session that exposed it now reads 4.4 hours working and 211.4 hours open. Across all four captured corpora, no trajectory holds more idle and work than elapsed time."},"resolution":"`meta.durationMs` gives way to `totals.time`, holding `elapsedMs`, `idleMs` and `workMs`. Idle is the sum of R68's intervals and work the union of R70's. Claude Code's own durations sit beside them as `reported`, covering the tree. R77 and R78 specify it.\n\nThe span now runs from the earliest timestamp a trajectory records to the latest, a tool result's included. Measured to the last event, one fixture held more idle and work than time. The viewer shows working time first, then the time open.","details":"Every adapter sets `meta.durationMs` to the span from the first timestamp to the last, and the index prints it as the trajectory's duration. One captured Claude Code session reports 211 hours. It sat open over a weekend: 207 of those hours are idle, and its events account for 4.4 hours of work.\n\nAcross thirty attended trajectories, 332 hours of reported duration hold 309 hours of idle. A reader comparing two sessions by that figure compares how long each was left open.\n\nThe normalizer already measures both parts, since R68 stamps idle and R70 stamps work on single events. Nothing adds them up, so elapsed time is the only figure a trajectory reports.\n\nClaude Code's `cost-state` record also carries its own durations: the process's wall time, and the time spent waiting on the model and running tools. Those cover the session and its sub-agents, and follow the process rather than the transcript. One session reports 18.3 hours of wall time against 8.9 hours of transcript. They belong beside tracer's figures as reported ones, under the rule §9 sets for cost.\n\nTo reproduce, normalize a session left open between turns and compare `meta.durationMs` with the sum of its idle intervals.","notes":[],"links":["TRC-013","TRC-015","TRC-017"]},{"id":"TRC-019","title":"OpenCode's step finish is stamped when the step started, so idle overlaps the step's work","type":"defect","severity":"low","status":"closed","foundBy":"session agent, checking that idle and work fit inside elapsed time for every captured trajectory under R77","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["5a972d4","d7aad65"],"integrated":[],"verified":"`make check` passes with parity enabled. A new test asserts that a step finish carries its message's completion time, and that idle and work fit inside elapsed time. It fails without the fix. The scrubbed fixtures carry no literal `stop`, so the test is what covers the idle branch.\n\nThe goldens moved 51 step-finish timestamps, and the end of five trajectories, with no other difference. Across the 24 captured OpenCode trajectories, none now holds more idle and work than elapsed time, where nine did."},"resolution":"A step finish now carries its message's `time.completed`, and falls back to the creation time only when a message has none. The fix is in the OpenCode adapter alone.","details":"An OpenCode `step-finish` part carries no time of its own, so the adapter stamps it with its message's creation time. That is when the step started, not when it finished.\n\nThe step whose reason is `stop` ends a turn (R69), and R68 starts the idle interval at it. So idle begins before the step's own reply was written, and overlaps the work R70 charges to that reply. In nine of 24 captured OpenCode trajectories, idle and work together exceed the trajectory's elapsed time, by 35 seconds in all.\n\nThe message records `time.completed`, the moment the step finished. A step finish should carry that, and fall back to the creation time only when a message has no completion time.\n\nTo reproduce, normalize a captured OpenCode session and compare `totals.time` idle plus work against elapsed.","notes":[],"links":["TRC-013","TRC-018"]},{"id":"TRC-020","title":"A card in the details list does not show which mark on the strip it belongs to","type":"improvement","severity":"low","status":"closed","foundBy":"user request: \"In the title bar of the details panels (like #12 · tool call etc). can you prefix it with te square/rectangle that it corresponds to? it'll make it easier to scroll.\"","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["617276f"],"integrated":[],"verified":"`make check` passes with parity enabled. Two new viewer tests assert the mark's kind, colour token, error cross and hollow form, and that it sits before the title text. A rendered codex trajectory showed the mark matching its selected cell in light and dark themes, and a cross on a rate-limited turn end."},"resolution":"Each card's title now opens with the event's mark, drawn from the table the strip paints with. It is hollow when redacted at source, and carries the strip's error cross when the event failed. The MANUAL says so beside the table of marks.","details":"The trajectory page draws each event twice: as a mark on the strip and as a card in the details list below it. A card's title names the event's index and kind in text, and nothing in it looks like the mark.\n\nA reader scrolling the list has to read each title to know which colour on the strip it answers to. The title should open with the mark itself: the kind's colour, hollow when the content was redacted at source, and the error cross when the event failed.","notes":[],"links":[]},{"id":"TRC-021","title":"The fixture suite runs in no gate, so five of its expectations fell behind the changes they measure","type":"defect","severity":"med","status":"closed","foundBy":"session agent, running the whole fixture suite after adding a check for card marks","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["f7c33bf","58bc0e8"],"integrated":[],"verified":"`make ci` passes, and its fixture-suite step reports 35 checks with 26 matching and 9 targets met. With no browser variable set and no `/usr/bin/chromium-browser`, `make fixtures` prints its SKIP line and exits 0. A timed run took 54 seconds against 20 for a warm `make check`."},"resolution":"`make ci` now runs the fixture suite after the ledger check, and `make check` still does not, because the suite takes about a minute. Like parity, it skips with a line saying why where there is no npm or no browser. SPEC lists it among the gates, and CONTRIBUTING counts it among those that can skip.","details":"The fixture suite in `apps/viewer/fixtures` drives the exported pages in a browser and compares 35 measurements against `expectations.json`. Neither `make check` nor `make ci` runs it, so a change can pass every gate while the suite fails.\n\nFive checks fail on the current tree, and each failure is an intended change the expectations never recorded. The index rollup still expects the token and cost totals from before the cost fixes. The kind chips predate a local command's echo becoming a system event. Two keyboard checks predate the raw JSON toggle on tool inputs, and the data size predates the time and cost fields.\n\nA suite nobody runs cannot catch anything. The first real defect it could have caught was a card mark four pixels out of line, and it only caught that once somebody ran it by hand.\n\nTo reproduce, run `make fixtures` with a browser configured.","notes":[{"date":"2026-09-21","text":"The five expectations were recorded in f7c33bf, each row carrying its approval, and the whole suite passes. The Makefile keeps the suite out of `make check` on purpose, as the oracle for a component migration. Whether it becomes a gate is the maintainer's decision, so the record stays open."},{"date":"2026-09-21","text":"The maintainer chose `make ci` over `make check`. The GitHub workflow's build job installs neither Node nor a browser, so it skips both parity and the fixture suite. They run in `make ci` on a machine with a browser."}],"links":["TRC-016","TRC-011","TRC-017","TRC-018","TRC-020"]},{"id":"TRC-022","title":"OpenCode stamps reasoning and text when they start, so their model time lands on the next event","type":"defect","severity":"med","status":"closed","foundBy":"user asked whether long thinking times were real; session agent checked them against the start and end times OpenCode records","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["71d75e5","8a38931"],"integrated":[],"verified":"`go test ./...` passes. A new test normalizes a 59-second reasoning part followed by a 4-second reply, and asserts that each carries its own time. It fails without the fix, reporting 1 and 59 seconds.\n\nThe goldens moved the timestamps of 55 reasoning and reply events, and the model time and size that follow from them, in the OpenCode fixtures alone. Across 747 steps in 24 captured OpenCode trajectories, no step's bar is now shorter than its own generation, where the reply after it used to take that time."},"resolution":"Reasoning and assistant text are now stamped with `time.end`, falling back to `time.start` when no end is recorded. User text keeps its start. The fix is in the OpenCode adapter alone.","details":"R70 measures each step from the end of the previous work to the end of this one, reading an event's timestamp as the moment the step finished. Claude Code and Codex stamp a block when it finishes. The OpenCode adapter stamps a reasoning or text part with `time.start`, when it began.\n\nSo each OpenCode step is charged the wait before it, and its own generation is charged to the event after it. In one captured session a reasoning part ran 59.0 seconds and the reply after it 3.8. The strip showed 1.0 second on the reasoning and 59.0 on the reply.\n\nAcross 24 captured OpenCode trajectories, 28 reasoning parts ran over 40 seconds, and the strip showed one. It showed 22 replies over 40 seconds, where six ran that long.\n\nThe part records `time.end`. A reasoning or text part should be stamped with it, as the other adapters stamp a finished block.","notes":[],"links":["TRC-015","TRC-019"]},{"id":"TRC-023","title":"Model time cannot be split into the wait before a step and its generation","type":"improvement","severity":"low","status":"closed","foundBy":"user asked whether thinking times of 45 seconds and more were real; the check found most of each was waiting before the model began","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["7b7d715","d686e1b"],"integrated":[],"verified":"`go test ./...` passes. Three new tests cover codex in both orders, OpenCode, and the cap that keeps the wait from going negative, and each fails without the change.\n\nThe goldens gained both fields on 55 OpenCode steps and changed nothing else. Across the captured corpora, all 1,824 codex and 747 OpenCode thinking and reply steps now split, and none of 736 Claude Code steps does. The step that prompted it carries 48,143 milliseconds of model time, 211 of them reasoning."},"resolution":"An event now carries `startTs` where the CLI records when the model began it, and its strip entry `activeMs`, the part of its model time spent generating. The codex adapter reads the start from the `item_completed` notice that shares the item's id, in either order. The OpenCode adapter reads the part's start. Claude Code's events carry neither. R79 specifies it.","details":"R70 gives each thinking step, reply and tool call the time from the end of the previous work to its own end. That is the round trip to the model: the wait for it to begin, then its generation. The figure is right, but a reader sees it labelled as thinking.\n\nIn one captured codex trajectory a thinking step carries 48.1 seconds. Codex records that the reasoning itself ran 0.2 seconds, and the 47.9 before it was spent waiting for the model to start. Nine codex steps carry over 40 seconds, and none of them reasoned for more than eight.\n\nTwo adapters can tell the parts apart. Codex's `item_completed` notice gives each reasoning item and message its start and end, and OpenCode gives every part a start time. Claude Code records only when a block finished, so its round trip cannot be split.\n\nAn event should carry when its step began wherever the CLI records it, and the strip should carry how much of the model time was generation.","notes":[],"links":["TRC-015","TRC-022"]},{"id":"TRC-024","title":"The strip shows which events ran but not how long they took, or how long the agent waited","type":"improvement","severity":"med","status":"closed","foundBy":"user, designing the strip from measured traces: every event drawn at one size says nothing about time, and waiting holds most of it","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 time accounting","evidence":{"commits":["7d8a051"],"integrated":[],"verified":"`make check` passes with parity enabled, and the fixture suite passes all 35 checks. Two new viewer tests cover every form the tooltip's time takes. Three fixture expectations were recorded with their reasons: the cell pitch, and one fewer card on the first screen of the large session because the strip is six pixels taller.\n\nThe viewer installs from npm the ui dev build of the commit that adds bars, pinned exactly in its `package.json`. The user reviewed the rendered strip on the four captured corpora before it was committed."},"resolution":"The strip now has two rows. A thinking step, a reply or a tool call rises by its time in the upper row, and a turn end hangs by its wait in the lower one. Both use a log scale, with ceilings of two minutes and one hour named once beside the cell width, and a notch on a bar that reached its ceiling. The lower row stays out of the overview, and the overview stands in for the scrollbar.\n\nThe tooltip names model time and splits it where the CLI recorded the start. The MANUAL describes both rows. The strip is drawn by EventLanes from the ui build that adds bars.","details":"The strip draws every event as the same square, coloured by kind. A two-second step and a two-minute one look the same, and a turn end after a three-hour wait looks like one after three seconds.\n\nThe normalizer now reports both quantities. R70 gives each thinking step, reply and tool call the time it accounts for, and R68 gives each turn end the wait after it. The strip draws neither.\n\nA step should rise by its time, and a turn end should hang by its wait in a row of its own. Each row should use a log scale with a named ceiling. The tooltip should give the true figure, and name model time as the round trip it is. Where a CLI records when the model began, the tooltip should split it into the wait and the generation.","notes":[],"links":["TRC-015","TRC-018","TRC-023"]},{"id":"TRC-025","title":"The index lane's meta line cuts off the cost now that the time label is longer","type":"defect","severity":"low","status":"closed","foundBy":"session agent, reviewing the rendered index with the user after the time label changed","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 strip changes","evidence":{"commits":["c0b1fd8"],"integrated":[],"verified":"Measured in a browser on the four corpora's split indexes, 94 lanes in all. Before the fix, every lane's line overflowed at 1280 px, by up to 317 px. After it, at 1280 and 600 px, no lane cuts its tokens, time or cost, and every row's tooltip matches its text. Only OpenCode's 24 long model names still cut at 1280 px, from the left. `make ci` passes, and its fixture suite reports no moved check."},"resolution":"Each lane now shows three rows: tokens and model, then time, then cost. Every row carries its full text as a tooltip. The model comes last in its row and cuts from the left, so a long name keeps its distinguishing end and the token count stays whole. The cost row is omitted when a trajectory has no figure.","details":"Each lane on the index shows one meta line: model, tokens, time and cost. That label now names both working and open hours, such as `2.6 h working · 31.5 h open`. The line overflows its column and ends in an ellipsis, so the cost, which comes last, is the part a reader loses.\n\nTo reproduce, export any attended Claude Code session with `--split` and open the index at a normal window width.","notes":[{"date":"2026-09-21","text":"Every lane overflows, not only attended ones: 94 of 94 across the four corpora, by up to 317 px in a 320 px column. No single line can hold the label, so the fix splits it into three rows: model and tokens, then time, then cost. The index also omitted the separator between time and cost."}],"links":["TRC-018","TRC-017"]},{"id":"TRC-026","title":"A --split index links to 404s when the export sits under a directory named traces","type":"defect","severity":"med","status":"closed","foundBy":"consumer report (another agent session), on 8501cf6 and d5ff8c2: \"every trace link on it returns 404\"","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 strip changes","evidence":{"commits":["d0e9d33"],"integrated":[],"verified":"The attended Claude Code set was exported with `--split` into a directory named `traces`, then opened over `file://` and over HTTP. On both, all 30 lane links mounted their trace pages, the back link returned to the index, and no page raised an error. Parity now writes its split export into a directory with that name. It fails when the old path test is restored, and `make ci` passes with the fix."},"resolution":"Each split page now declares its kind in its `#mode` block, as `index` or `trace`, and the viewer routes from that declaration alone (R80). The directory's name no longer matters. Parity writes its split export under a directory named `traces`, so a return to reading the path fails the gate.","details":"`isTracePage` in `apps/viewer/src/routes.ts` decides whether a page is a trace page from the URL alone, with `/(?:^|\\/)traces\\/[^/]+\\.html$/`. It adds the `traces/` prefix to links only on the index.\n\nAn export written with `--split -o traces` and served over HTTP opens its index at `/traces/index.html`. That path matches the pattern, so the index takes itself for a trace page and drops the prefix. The browser then requests `/traces/\u003cid>.html`, where the page is `/traces/traces/\u003cid>.html`.\n\nThe export directory's name is the user's choice, and the links must not depend on it. The viewer should learn which kind of page it is on from something the export writes, such as a marker in the page, never from the path.\n\nTo reproduce, run `cs-tracer \u003csessions> --split -o traces`, serve the parent directory, open `/traces/index.html` and click a trace. The same export written to `member-traces` works.","notes":[{"date":"2026-09-21","text":"The function is `inTracePage`, not `isTracePage` as the details say. The wrong guess did more than break links: an index taking itself for a trace page also skips a missing summary block silently, where it should report a corrupt export. The export already writes a `#mode` block into every page, so the page's kind now goes there."}],"links":[]},{"id":"TRC-027","title":"A reply Claude Code writes for an API error is not marked as an error","type":"defect","severity":"low","status":"closed","foundBy":"session agent, while adding the synthetic field for TRC-015","opened":"2026-09-21","resolved":"2026-09-21","stint":"2026-09-21 strip changes","evidence":{"commits":["48a601a"],"integrated":[],"verified":"Three attended projects were normalized and exported with the fix. All five API-error replies became error events labelled with their reason, four `authentication_failed` and one `rate_limit`. No session reports `\u003csynthetic>` as its model, and the one that opens on a synthetic reply now reports `claude-opus-5`. The eleven \"No response requested.\" replies stay unmarked. The maintainer checked the error cards in the viewer, and `make ci` passes."},"resolution":"The Claude adapter marks a reply flagged `isApiErrorMessage` with `isError`, and labels it with the record's `error` reason. The text stays Claude Code's own sentence, as R67 has codex do. A `\u003csynthetic>` reply no longer sets `meta.model`, so a session of only synthetic replies names no model. A unit test builds both cases from the real records' shapes.","details":"Claude Code writes a `\u003csynthetic>` assistant record for some replies it makes without the model, including an API error, which also carries `isApiErrorMessage`. The adapter now marks these `synthetic`, but not as errors. This is the Claude Code counterpart of the codex failure R67 fixed, and a turn that died on the provider still reads as a reply.\n\nA session whose first assistant record is synthetic also sets `meta.model` to `\u003csynthetic>`, since the model is taken from the first one.\n\nNo captured corpus holds an API-error reply, so a fixture or unit test has to be built for it.","notes":[{"date":"2026-09-21","text":"Real API-error replies do exist, in three attended sessions outside the captured corpora. Two ended on an expired login, flagged `authentication_failed`, and one on a usage limit, flagged `rate_limit`. One more session opens on a synthetic \"No response requested.\" reply. The scrubbed fixture's one synthetic record is not an API error, so no golden moves."}],"links":["TRC-012","TRC-015"]},{"id":"TRC-028","title":"An attended Claude Code tool call may count the user's permission prompt as the tool's time","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, reviewing how R70 charges time in attended sessions; unverified","opened":"2026-09-21","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["39bba1d","e76e538","c11ba6d"],"integrated":[],"verified":"Normalized local sessions with the change. A Claude Code project run mostly in `default` mode marks 203 tool calls `person` and its read-only calls `automatic`. The attended corpus, in `auto` mode, marks all 2,627 of its calls `classifier`. Local codex sessions mark 1,580 escalated calls `person` and 2,804 others `automatic`. A prompted Edit of 141 seconds reads as taking 2.4 minutes, which may include waiting for approval.\n\nThe regenerated goldens differ from the last ones only by the new field and the sizes it adds. The codex fixtures record no approval policy, so a unit test covers that mapping. `make ci` passes, after two approved fixture moves: the payload grew 2.5 per cent, and one page budget rose to match."},"resolution":"Where a CLI records its permission mode or approval policy, each tool call now carries `approval`: `person`, `classifier` or `automatic` (R82). The Claude adapter follows `permissionMode` through the session and knows which tools run unasked in each mode. The codex adapter reads each turn's policy, under which only an escalated call can reach a person. The strip's timing readout says a call's time may include waiting for approval, or an approval check.\n\nNo CLI records the approval itself, so the wait cannot be split from the run. OpenCode's adapter leaves the field absent, since no session at hand holds a prompt.","details":"A tool call's time runs from the end of the previous work to its result. In an attended session Claude Code can wait for the user to approve a tool before running it, and that wait would fall inside the tool's time. A slow bar would then show a person deciding, not a tool running.\n\nThis is a suspicion to verify first: find tool calls whose time far exceeds their run, and check whether a permission record sits between the call and its result.","notes":[{"date":"2026-09-22","text":"The question is wider than Claude Code. Codex asks for approval under `approval_policy: on-request`, and OpenCode has permission prompts too. The captured codex corpus ran with `never`, so it cannot show a prompt. Local attended codex sessions hold about 1,590 tool calls that asked for escalated permissions. The only OpenCode sessions at hand store no prompt at all, so OpenCode stays unverified here."},{"date":"2026-09-22","text":"Measured on local Claude Code transcripts, the wait is real where the mode prompts. In `default` mode an Edit takes a median 2.1 seconds from call to result, and 13.7 at the 90th percentile. With edits approved automatically it takes 0.04 and 0.10, and Read, which never prompts, stays near 0.01 in every mode. Bash under `acceptEdits`, which still prompts for commands, reaches 54 seconds at the 90th percentile. The transcript holds no record of the approval, so nothing marks where the wait ends and the tool starts.\n\nThe attended corpus runs in `auto` mode, where a classifier approves instead of a person, and adds about 2 seconds at the 90th percentile to writes. In local codex sessions under `on-request`, 1,972 escalated calls ran no slower than 2,390 plain ones, a median 0.16 seconds against 0.33. Their approvals cost no human time, and codex writes no approval record either."}],"links":["TRC-015"]},{"id":"TRC-029","title":"A small share of attended elapsed time is neither idle nor work","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, measuring totals.time across the attended Claude Code corpus","opened":"2026-09-21","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":[],"integrated":[],"verified":"Rebuilt every trajectory's idle and work intervals from the normalized events, following the same rules the normalizer applies, and took the uncovered intervals of elapsed time. Across the 31 attended trajectories that gives 5.75 of 343.5 hours, 1.67 per cent, matching the figure this record opened with. Each uncovered interval was then labelled by the events on either side of it.\n\nThe attended remainder has three shapes. Most of it, 5.18 hours, follows a session's last turn end when only bookkeeping records come after it, and one session holds 5.10 of those hours. Another 23 minutes, in five gaps, follow a sub-agent's reply that ended its turn with no turn-duration record, while it waited for a notification. A further 9 minutes precede the first instruction, where a session file opens with local commands and an informational record. The rest is 36 seconds of milliseconds between final replies and their turn-duration records.\n\nThe codex remainder of 2.45 per cent is one shape: the one to two minutes between a turn's last tool result and the rate-limit error that ended it. The unattended Claude and OpenCode corpora leave 0.0 per cent."},"resolution":"The remainder is characterised, and three specific defects carry it. The wait after a session's last turn end, when only bookkeeping follows, is 89 per cent of the attended remainder. It is filed as the turn end followed only by bookkeeping. A sub-agent's wait after a reply that ended its turn, with no turn-duration record in its transcript, is filed as the sub-agent that stops with no tool call pending. The interval before a turn end that an error ended, which is the whole codex remainder, is filed as the interval before a turn end that ended in an error. The minutes before a session's opening instruction are by design: elapsed runs from the earliest record, and local commands run before that instruction.","details":"Across thirty attended trajectories, 5.7 of 332.1 hours of elapsed time sit in neither an idle interval nor any event's work interval, 1.7% in all. The unattended corpora leave 0.0% to 2.5%. The gaps were not characterised. They may be interruptions, a turn that ended with no turn-end record, or another record type that should end or start work.","notes":[{"date":"2026-09-22","text":"The turn-duration record is the only source of turn ends in the Claude Code adapter, and sub-agent transcripts do not carry it. That is why every gap between a reply and a notification sits in a sub-agent trajectory."}],"links":["TRC-016","TRC-018","TRC-034","TRC-035","TRC-036"]},{"id":"TRC-030","title":"Tool output renders as one escaped block with no bound on its length","type":"improvement","severity":"low","status":"closed","foundBy":"session agent, carried from TRC-011, which fixed tool inputs and deferred outputs","opened":"2026-09-21","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":["d6103a3"],"integrated":[],"verified":"Four corpora were normalized and every tool result measured. The median output runs 8 to 28 lines by corpus, the 90th percentile 48 to 376, and the longest 1,489. Between 13 and 42 per cent of outputs run past 40 lines. Almost all are plain text: JSON documents and patches together make up under 5 per cent.\n\nOn the codex site, the card holding the longest output stood 29,260 px tall once its output was opened, in a list viewport of 532 px. With the change it stands 628 px, offers `Show all · 1,489 lines`, and grows to 31,274 px when asked, with the control then reading `Fold`. Closed, the card is unchanged at 236 px. Neither build raised a page error.\n\n`make ci` passes: parity PASS, and every fixture check passes, 27 ok and 9 met. No expectation moved. The single-file page budget is close: the large fixture measures 1,139,136 bytes against a limit of 1,140,000."},"resolution":"A tool's output renders in the same bounded block as an input, whole and unaltered, scrolling on its own past the bound (R85). Past twenty lines the block offers a control that lifts the bound, so the whole text flows in the page. Shape, never tool name, picks the grammar: a document that parses as JSON is coloured as JSON, a patch as a diff, and everything else stays plain. The output stays folded under its summary as before, opening by itself only when the call failed.","details":"An event card shows a tool's output as `\u003cpre>{event.result.text}\u003c/pre>`. Outputs run far longer than inputs, so the open question is bounding and truncation, with the full text still reachable. The shape detection `ToolInput.tsx` uses for inputs is the likely model.","notes":[{"date":"2026-09-22","text":"A bound alone, with the block scrolling inside the card, already keeps the list navigable. The control exists for reading. A long output read through a 20 rem window is a chore, and a reader who asks for all of it has chosen the tall card."}],"links":["TRC-011"]},{"id":"TRC-031","title":"Search rescans every chunk of every trace from scratch on each query","type":"improvement","severity":"low","status":"wont-fix","foundBy":"session agent, carried from the previous handoff","opened":"2026-09-21","resolved":"2026-09-22","stint":"2026-09-21 strip changes","evidence":{"commits":[],"integrated":[],"verified":"Timed in a headless Chromium on the longest trace page of each of four exported corpora, from the Enter key to the match count appearing with no scan pending. The longest is a Claude Code session of 2,360 events in three chunks, holding 354 thousand characters of text. There a search takes 20 to 50 ms end to end, across five queries and three rounds. The other three pages, of 391 to 803 events, take 5 to 30 ms.\n\nThe scan itself is a small part of that. Over the same 2,360 parsed events the substring pass takes under 1 ms per query, a median of 0.4 to 0.7 ms over 20 runs. Over the same events repeated ten times, 23,600 in all, it takes 3 to 4 ms. Parsing the three chunks once takes 2.4 ms. The rest of the time is the page re-rendering its list."},"resolution":"Measured, the rescan costs nothing a reader can feel. A search on the largest trace at hand answers in under 50 ms. The scan it repeats is under 1 ms of that, growing to about 4 ms at ten times the size. The page re-render is the whole of the rest, and an index or a cache of matches would not touch it. The record's premise was also wider than the code: search runs ov
