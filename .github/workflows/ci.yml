# Build, test and gate on every push.
#
# cs-tracer is a single static binary with no runtime dependencies, so the
# matrix is just the platforms it ships for, plus one job for the prose rules
# and one for the publication rules.
#
# `make check` runs the whole gate list and skips what a runner cannot do: the
# viewer sources need the design-system repository beside this checkout, and the
# visual-parity gate needs a browser. Both report as skips where they run,
# saying what was checked rather than implying more.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # make check-version compares the stamp to git describe
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # No linter install step: golangci-lint, deadcode and actionlint are pinned
      # as Go tools, so the gates build them from the module cache at the
      # versions this repository records. An unpinned linter would turn somebody
      # else's release into a red build on a pull request that touched nothing.
      # Nor are the cs- tools here: they are pinned in go.mod too.

      # gofmt, vet, the build, the version stamp, the Go suite, both linters:
      # the same target a contributor runs before pushing (CONTRIBUTING.md).
      - name: make check
        run: make check

      # `make check` already merged the tiers, printed the aggregate to the job
      # summary and ran the gate — every test this repo has runs in this one
      # job, so there is nothing on another machine to merge with. The profile
      # is kept so a run's coverage can be opened line by line afterwards.
      - name: keep the coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: .coverage/coverage.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      # Schema only: this validates the manifest, and does not prove a release
      # can be cut.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # An invalid workflow file fails the run with zero jobs and no annotation in
  # the API, which is the least legible failure the forge produces. actionlint
  # is pinned as a Go tool in go.mod, so a clean `make actionlint` on a laptop
  # means a clean one here. Extra runner labels it does not know about live in
  # .github/actionlint.yaml.
  actionlint:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make actionlint

  # Its own job because it needs no matrix and builds nothing of this
  # repository, so it answers in a minute and answers even when the tests are
  # failing. `make check` runs it too, for the contributor who runs one command
  # before pushing.
  prose:
    name: docs prose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make prose

  # The publication rules. fetch-depth: 0 because half of them read the
  # history, and a shallow checkout would let them pass by seeing nothing.
  # Everything the documents point at, resolved against the tree. It needs
  # no binary either, so it answers beside the prose job rather than after
  # the build.
  refs:
    name: docs refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make refs

  # The publication rules. fetch-depth: 0 because half of them read the
  # history, and a shallow checkout would let them pass by seeing nothing.
  oss:
    name: open-source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make oss

  # The documented interface against the real one: every command they name
  # exists, every command the binary carries is named, the settings the code
  # reads are the settings they list, and a sample output is still what the
  # command prints. It builds first, because every check here asks the binary.
  surface:
    name: docs surface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make surface

  # The viewer's freshness gate, and the only one that can catch a stale
  # artifact. The compiled viewer under internal/cli/viewer is COMMITTED and
  # //go:embed reads it at compile time, so a binary can pass every other gate
  # while shipping an old viewer. `make build` rebuilds it whenever a source
  # under apps/viewer or ui/ is newer, but that check is a list of prerequisites
  # somebody has to keep complete; this job needs no list. It rebuilds
  # unconditionally and fails if the result differs from what is committed.
  #
  # The other jobs have no Node toolchain and take the committed-artifact path,
  # which is what a clone without npm gets. This one installs Node on purpose.
  viewer:
    name: viewer artifacts are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13" # the sub-projects say >=22.13; the floor is what CI proves
          cache: npm
          # No root manifest: each Node sub-project installs its own, so the
          # cache key has to be built from both lockfiles.
          cache-dependency-path: |
            apps/viewer/package-lock.json
            fixtures/test/package-lock.json
      - run: make viewer-build
      - name: the committed artifacts match the sources
        run: git diff --exit-code -- internal/cli/viewer

  # The ledger's freshness gate. CONTRIBUTING.md asks for a render and a check
  # before every commit that touches ledger/, and `make check` skips it where
  # cs-ledger is not installed — so CI installs it and makes the gate real.
  ledger:
    name: ledger check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make ledger
