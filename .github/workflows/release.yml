# Tagged release: static multi-arch binaries, checksums, SBOMs and a keyless
# cosign signature over the checksums. Triggered by pushing a v* tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The viewer is not rebuilt here. Its artifacts are committed, so the release
# cuts from the tree as it stands; refresh them with `make viewer-build` and
# commit before tagging.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release
  id-token: write # keyless cosign signing via ambient OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v4.1.2
      - name: install cyclonedx-gomod
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
